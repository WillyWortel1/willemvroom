.stick .base{position:absolute;left:10px;top:10px;width:130px;height:130px;border-radius:50%;background:radial-gradient(circle,rgba(20,70,110,.55),rgba(5,30,55,.75));border:3px solid #bff3ff;box-sizing:border-box}

.stick .ball{position:absolute;left:47px;top:47px;width:56px;height:56px;border-radius:50%;background:radial-gradient(circle at 36% 30%,#ffe08a,#ff9f1a 55%,#b45309);border:3px solid #fff3c4;box-sizing:border-box}
#bRemote{position:fixed;pointer-events:auto;touch-action:none;border-radius:14px}
#ov{position:fixed;inset:0;z-index:8;display:flex;align-items:center;justify-content:center;background:rgba(3,20,38,.72);color:#eafcff;overflow:auto}
#ov.hide{display:none}
.card{width:min(94vw,560px);padding:18px 16px;box-sizing:border-box;text-align:center}
.card h1{font:900 42px system-ui,sans-serif;margin:4px 0;color:#ffe066;letter-spacing:1px;text-shadow:0 3px 0 #c2410c}
.card p{margin:6px 0;font-size:14px;line-height:1.4;color:#cfefff}
.big{font:800 18px system-ui,sans-serif;padding:12px 26px;border-radius:14px;border:0;background:#ffcf33;color:#3a2200;margin:6px;cursor:pointer;box-shadow:0 4px 0 #b07800}
.sec{font:700 14px system-ui;padding:9px 16px;border-radius:12px;border:2px solid #7fdcff;background:transparent;color:#eafcff;margin:4px;cursor:pointer}
.row{margin:10px 0 2px;text-align:left}
.row b{display:block;font-size:13px;color:#ffe066;margin-bottom:4px}
.opts{display:flex;gap:6px}
.opt{flex:1;padding:8px 4px;border-radius:10px;border:2px solid #2d6c8f;background:#0d3554;color:#eafcff;font:600 12px system-ui;cursor:pointer;line-height:1.25}
.opt.sel{border-color:#ffe066;background:#1d5d86}
.opt small{display:block;font-weight:400;color:#a9d9f0;font-size:11px}
.stats{font-size:12px;color:#a9d9f0;margin-top:8px}

bat_:'Battery',falls_:'Falls',combo:'Combo'}};
Object.assign(T.nl,{sea:'ZEE',beach:'STRAND',heading:'Koers',side:'Golf naast je',waveS:'GOLF',shout:'Hé! Mijn golf!',behind:'Golf achter je',proost:'Proost!',party:'Nieuw record! Strandfeest met je vrienden 🎉',finHit:'Haai! Wegwezen!',finOk:'Haai ontweken',gullHit:'Krijs! Meeuw pikt je!',gullOk:'Meeuw ontweken',surfHit:'Gescholden door een surfer!',surfOk:'Netjes uit de weg',dodge:'Opzij = uitwijken, omlaag = bukken',fsT:'Freeride-instellingen',fsW:'Golfhoogte',fsS:'Golfsnelheid',fsSt:'Sturen',fsP:'Golfperiode',fsH:'Gevaren (meeuwen, haaien, surfers)'});
Object.assign(T.en,{sea:'SEA',beach:'BEACH',heading:'Heading',side:'Wave beside you',waveS:'WAVE',shout:'Hey! My wave!',behind:'Wave behind you',proost:'Cheers!',party:'New best! Beach party with your friends 🎉',finHit:'Shark! Get out!',finOk:'Dodged the shark',gullHit:'Squawk! Gull attack!',gullOk:'Ducked the gull',surfHit:'Yelled at by a surfer!',surfOk:'Nicely out of the way',dodge:'Sideways = swerve, down = duck',fsT:'Freeride settings',fsW:'Wave height',fsS:'Wave speed',fsSt:'Steering',fsP:'Wave period',fsH:'Hazards (gulls, sharks, surfers)'});

const t=k=>T[lang][k];
let FS={wave:1,speed:1,period:1,steer:1,haz:true,v:2};try{const o=JSON.parse(lsGet('fa-free','{}'));if(o.v===2)Object.assign(FS,o);else if('haz' in o)FS.haz=o.haz;}catch(e){}
let haz=[];

/* ---------- setup ---------- */
const GEAR={
 wing:[{k:'S',lift:.78,v:1.18,turn:1.2,stab:-.08},{k:'M',lift:1,v:1,turn:1,stab:0},{k:'L',lift:1.35,v:.84,turn:.78,stab:.12}],
 stab:[{k:'S',turn:1.18,stab:-.15},{k:'L',turn:.88,stab:.18}],
 mast:[{k:'65',len:65,turn:1.08},{k:'75',len:75,turn:1},{k:'85',len:85,turn:.9}],
 board:[{k:'S',dive:.95,get:.6,w:.95},{k:'M',dive:.75,get:.85,w:1},{k:'L',dive:.55,get:1.15,w:1.07}],
 bat:[{k:'S',cap:85,w:.94},{k:'L',cap:145,w:1.07}]};
let sel={wing:1,stab:0,mast:1,board:1,bat:0};
try{const s=JSON.parse(lsGet('fa-gear','null'));if(s)for(const k in sel)if(GEAR[k][s[k]])sel[k]=s[k];}catch(e){}
function gear(){const w=GEAR.wing[sel.wing],s=GEAR.stab[sel.stab],m=GEAR.mast[sel.mast],b=GEAR.board[sel.board],a=GEAR.bat[sel.bat];
 const weight=b.w*a.w;
 return {lift:w.lift/weight,vmax:150*0.55*w.v/Math.sqrt(weight),turn:w.turn*s.turn*m.turn,stab:Math.max(.4,1+w.stab+s.stab),mast:m.len,dive:b.dive,get:b.get*(0.8+0.2*w.lift),cap:1.7*a.cap/(0.85+0.15*w.lift/w.v)};}

/* ---------- audio ---------- */
let actx=null,master=null,hum=null,humG=null,unlocked=false;
function audio(){try{const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;
 if(!actx){actx=new AC();master=actx.createGain();master.gain.value=muted?0:.8;master.connect(actx.destination);
  hum=actx.createOscillator();hum.type='sawtooth';hum.frequency.value=90;humG=actx.createGain();humG.gain.value=0;const f=actx.createBiquadFilter();f.type='lowpass';f.frequency.value=500;hum.connect(f);f.connect(humG);humG.connect(master);hum.start();}
 if(actx.state!=='running'){const p=actx.resume();if(p&&p.catch)p.catch(()=>{});}
 if(!unlocked){unlocked=true;const b=actx.createBuffer(1,1,22050),s=actx.createBufferSource();s.buffer=b;s.connect(actx.destination);s.start(0);}
}catch(e){}}
['pointerdown','touchstart','touchend','mousedown','keydown'].forEach(ev=>document.addEventListener(ev,audio,{capture:true,passive:true}));
document.addEventListener('visibilitychange',()=>{if(!actx)return;if(document.hidden){actx.suspend().catch(()=>{});if(G.mode==='play')G.paused=true;}else actx.resume().catch(()=>{});});
function tone(f,d,type,vol,f2){if(!actx||muted)return;const o=actx.createOscillator(),g=actx.createGain(),n=actx.currentTime;o.type=type||'square';o.frequency.setValueAtTime(f,n);if(f2)o.frequency.exponentialRampToValueAtTime(f2,n+d);g.gain.setValueAtTime(vol||.15,n);g.gain.exponentialRampToValueAtTime(.001,n+d);o.connect(g);g.connect(master);o.start(n);o.stop(n+d+.02);}
function noise(d,vol){if(!actx||muted)return;const n=actx.currentTime,len=Math.floor(actx.sampleRate*d),b=actx.createBuffer(1,len,actx.sampleRate),c=b.getChannelData(0);for(let i=0;i<len;i++)c[i]=(Math.random()*2-1)*(1-i/len);const s=actx.createBufferSource(),g=actx.createGain(),f=actx.createBiquadFilter();f.type='lowpass';f.frequency.value=1200;s.buffer=b;g.gain.value=vol||.25;s.connect(f);f.connect(g);g.connect(master);s.start(n);}
const SFX={ok:()=>{tone(520,.1,'square',.12);setTimeout(()=>tone(780,.14,'square',.12),90);},bad:()=>tone(300,.35,'sawtooth',.15,80),splash:()=>noise(.6,.3),
 trick:(c)=>tone(440+c*80,.15,'triangle',.18,880+c*120),barrel:()=>{[523,659,784,1046,1318].forEach((f,i)=>setTimeout(()=>tone(f,.25,'square',.12),i*110));}};

/* ---------- canvas ---------- */
if(!CanvasRenderingContext2D.prototype.roundRect)CanvasRenderingContext2D.prototype.roundRect=function(x,y,w,h,r){r=Math.min(r,w/2,h/2);this.moveTo(x+r,y);this.arcTo(x+w,y,x+w,y+h,r);this.arcTo(x+w,y+h,x,y+h,r);this.arcTo(x,y+h,x,y,r);this.arcTo(x,y,x+w,y,r);this.closePath();};
const cv=document.getElementById('c'),ctx=cv.getContext('2d');let W=0,H=0,DPR=1,SY=0,RX=0,PX=1;
function resize(){DPR=Math.min(2,window.devicePixelRatio||1);W=innerWidth;H=innerHeight;cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);cv.style.width=W+'px';cv.style.height=H+'px';ctx.setTransform(DPR,0,0,DPR,0,0);
 SY=Math.round(H*(W<600?0.5:0.56));RX=W*0.4;PX=Math.max(.8,Math.min(1.6,Math.min(W,H*1.2)/520));}
addEventListener('resize',resize);resize();

/* ---------- invoer ---------- */
const K={up:false,down:false};let motorPress=false,turnPress=false;
function setBtn(id,down,up){const b=document.getElementById(id);
 b.addEventListener('pointerdown',e=>{e.preventDefault();b.classList.add('on');try{b.setPointerCapture(e.pointerId);}catch(_){}down();});
 const u=e=>{b.classList.remove('on');if(up)up();};b.addEventListener('pointerup',u);b.addEventListener('pointercancel',u);b.addEventListener('lostpointercapture',u);
 b.addEventListener('contextmenu',e=>e.preventDefault());}
let turnDir=0,stickX=0;const KX={l:false,r:false};
(function(){const st=document.getElementById('stick'),ball=document.getElementById('ball');let id=null,cx=0,cy=0,side=0;const R=55;
 function mv(e){let dx=e.clientX-cx,dy=e.clientY-cy;const d=Math.hypot(dx,dy);if(d>R){dx*=R/d;dy*=R/d;}ball.style.transform='translate('+dx+'px,'+dy+'px)';
  K.up=dy<-R*0.35;K.down=dy>R*0.35;const ax=dx/R,dz=0.1;stickX=Math.abs(ax)<dz?0:Math.sign(ax)*Math.min(1,(Math.abs(ax)-dz)/(1-dz)*1.15);}
 st.addEventListener('pointerdown',e=>{e.preventDefault();if(id!==null)return;id=e.pointerId;const r=st.getBoundingClientRect();cx=r.left+r.width/2;cy=r.top+r.height/2;try{st.setPointerCapture(id);}catch(_){}mv(e);});
 st.addEventListener('pointermove',e=>{if(e.pointerId===id)mv(e);});
 const up=e=>{if(e.pointerId!==id)return;id=null;side=0;stickX=0;K.up=K.down=false;ball.style.transform='';};st.addEventListener('pointerup',up);st.addEventListener('pointercancel',up);
 const rm=document.getElementById('bRemote');let rid=null,ry=0,moved=false,p0=1;
 rm.addEventListener('pointerdown',e=>{e.preventDefault();rid=e.pointerId;ry=e.clientY;moved=false;p0=P?P.pwr:1;try{rm.setPointerCapture(rid);}catch(_){}});
 rm.addEventListener('pointermove',e=>{if(e.pointerId!==rid||!P)return;const d=ry-e.clientY;if(Math.abs(d)>10){moved=true;P.pwr=Math.max(0.4,Math.min(1,p0+d/120));if(!P.motor)P.motor=true;}});
 const ru=e=>{if(e.pointerId!==rid)return;rid=null;if(!moved)motorPress=true;};rm.addEventListener('pointerup',ru);rm.addEventListener('pointercancel',()=>{rid=null;});
 window.__stickT={mv:(dx,dy)=>{const r=st.getBoundingClientRect();cx=r.left+r.width/2;cy=r.top+r.height/2;mv({clientX:cx+dx,clientY:cy+dy});},rel:()=>{side=0;stickX=0;K.up=K.down=false;ball.style.transform='';}};
})();
function placeRemote(){const rm=document.getElementById('bRemote');const g=remoteGeom();rm.style.left=g.x+'px';rm.style.top=g.y+'px';rm.style.width=g.w+'px';rm.style.height=g.h+'px';}
function remoteGeom(){const touch=document.body.classList.contains('touchui');const rw=Math.min(118,Math.max(92,W*0.27)),rh=rw*1.45;return {w:rw,h:rh,x:W-rw-(touch?40:60),y:H-rh-(touch?44:40)-safeB()};}
addEventListener('resize',()=>setTimeout(placeRemote,50));setTimeout(placeRemote,0);
addEventListener('keydown',e=>{const c=e.code;if(e.repeat&&!['ArrowUp','ArrowDown','KeyW','KeyS'].includes(c))return;
 if(c==='ArrowUp'||c==='KeyW')K.up=true;else if(c==='ArrowDown'||c==='KeyS')K.down=true;else if(c==='KeyM'||c==='ShiftLeft'||c==='ShiftRight')motorPress=true;
 else if(c==='ArrowRight'||c==='KeyD'){KX.r=true;}else if(c==='ArrowLeft'||c==='KeyA'){KX.l=true;}else if(c==='Space'){}else if(c==='KeyP'||c==='Escape'){togglePause();}else if(c==='Enter'&&G.mode!=='play'){const b=document.querySelector('#ov .big');if(b)b.click();}else return;e.preventDefault();});
addEventListener('keyup',e=>{const c=e.code;if(c==='ArrowRight'||c==='KeyD')KX.r=false;if(c==='ArrowLeft'||c==='KeyA')KX.l=false;if(c==='ArrowUp'||c==='KeyW')K.up=false;if(c==='ArrowDown'||c==='KeyS')K.down=false;});
addEventListener('blur',()=>{K.up=K.down=false;KX.l=KX.r=false;});

/* ---------- spelstatus ---------- */
const G={mode:'menu',paused:false,free:false};
let P,waves,floaters,msg,msgT,gearNow,celebrate=0,sprays=[];
function say(s,d){msg=s;msgT=d||1.6;}
function newGame(free){G.free=free;gearNow=gear();G.mode='play';G.paused=false;document.body.classList.add('playing');
 P={sx:0,bank:0,yaw:0,th:0,rz:0,rx:0,carve:0,armed:true,pwr:1,mood:.6,lane:0,laneX:0,hazT:5,dist:0,lastDir:1,phase:'paddle',score:0,bat:100,falls:0,motor:true,v:0,prog:0,dive:0,diveCd:0,h:0,vy:0,meter:0,getT:0,wave:null,p:.3,energy:1,combo:1,lastMove:-9,time:0,turnAnim:0,dir:1,inv:0,barrel:null,rides:0,barrels:0,maxCombo:1};
 if(free)gearNow.turn*=FS.steer;haz=[];G.party=0;waves=[];floaters=[];sprays=[];celebrate=0;startPaddle();hideOv();}
function startPaddle(){P.phase='paddle';P.th=0;haz=[];P.dir=1;P.prog=0;P.h=0;P.v=0;P.wave=null;P.barrel=null;P.motor=true;waves=[];spawnWW(W*0.9);say(t('paddle'),2.5);}
function spawnWW(x){waves.push({kind:'ww',dx:x,passed:false});}
function startGetup(){P.phase='getup';P.dir=-1;P.meter=0;P.getT=0;waves=[];say(t('getup'),2.2);}
function startFoil(){P.phase='foil';P.th=Math.PI;P.dir=-1;P.h=gearNow.mast*0.45;P.vy=0;P.v=gearNow.vmax*0.75;P.motor=true;waves=[];nextSwell(W*0.6);say(t('foil'),2);}
function nextSwell(x){const big=G.free?(0.75+Math.random()*0.5):(0.45+Math.random()*0.55);
 const fw=G.free?FS.wave:1,fsp=G.free?FS.speed:1;waves.push({kind:'swell',dx:W*0.5+x,A:(70+70*big)*fw*PX,wf:(90+40*big)*PX,spd:(115+40*big)*0.55*fsp,broken:Math.random()<0.55,hollow:big*fw>(G.free?0.85:0.93),age:0});}
function fall(why){if(P.inv>0)return;SFX.splash();SFX.bad();say(why,2);P.mood=Math.max(0,P.mood-.25);haz=[];P.falls++;P.combo=1;P.inv=1.5;P.motor=false;
 if(!G.free&&P.falls>=3){endGame(t('falls'));return;}P.phase='swim';P.swimT=1.4;}
function endGame(why){G.mode='over';document.body.classList.remove('playing');const key=G.free?'freeride':'sessie';const nh=P.score>hi[key];G.party=nh&&P.score>0;if(nh){hi[key]=P.score;lsSet(G.free?'fa-hi-free':'fa-hi',String(P.score));}

/* ---------- golfprofiel ---------- */
function waveH(w,x){ // hoogte boven zeeniveau op scherm-x
 const cx=RX+w.dx,d=x-cx;if(w.kind==='ww')return Math.exp(-((d/(26*PX))**2))*22*PX;
 const wd=d<0?w.wf:w.wf*2.2;return w.A*Math.exp(-((d/wd)**2));}
function surf(x,tm){let y=SY+Math.sin(x*0.02+tm*1.5)*3*PX+Math.sin(x*0.007-tm)*4*PX;for(const w of waves)y-=waveH(w,x);return y;}
function placeOnFace(w,p){p=Math.max(.06,Math.min(.97,p));w.dx=w.wf*Math.sqrt(-Math.log(p));}

/* ---------- update ---------- */
function update(dt){
 P.time+=dt;if(P.inv>0)P.inv-=dt;if(msgT>0)msgT-=dt;if(celebrate>0)celebrate-=dt;
 const g=gearNow;
 if(motorPress){motorPress=false;if(P.phase!=='getup'&&P.phase!=='swim'){P.motor=!P.motor;tone(P.motor?300:200,.08,'square',.08);}
   if(P.phase==='foil'&&!P.motor)tryCatch();}
 const tp=turnPress;turnPress=false;
 P.dist+=Math.abs(P.v)*dt;P.mood+=(0.55-P.mood)*dt*0.03;P.mood=Math.max(0,Math.min(1,P.mood));
 const rawX=Math.max(-1,Math.min(1,stickX+(KX.r?1:0)-(KX.l?1:0)));const sens=(G.free?FS.steer:1)*gearNow.turn;
 P.sx=rawX;P.bank+=(rawX*Math.min(1.3,sens)-P.bank)*Math.min(1,dt*8);
 const rate=(P.phase==='ride'?2.0:P.phase==='foil'?1.5:P.phase==='paddle'?1.1:0)*sens;
 P.th+=rawX*rate*dt;if(P.th>Math.PI)P.th-=2*Math.PI;if(P.th<-Math.PI)P.th+=2*Math.PI;
 if(Math.abs(rawX)>0.45){P.carve+=Math.abs(rawX)*dt*sens;turnDir=Math.sign(rawX);}else{P.carve=Math.max(0,P.carve-dt*2);}
 if(Math.abs(rawX)<0.25)P.armed=true;
 let carveEv=false;if(P.armed&&P.carve>0.3){carveEv=true;P.armed=false;P.carve=0;}
 const mps=P.phase==='swim'||P.phase==='getup'?0:Math.max(0,P.v)*(P.phase==='paddle'?0.17:0.31)/3.6;
 const mvx=Math.sin(P.th)*mps,mvz=Math.cos(P.th)*mps;P.rz+=mvz*dt;P.rx+=mvx*dt;
 if((!G.free||FS.haz)&&P.phase!=='getup'&&P.phase!=='swim'&&!P.barrel){P.hazT-=dt;if(P.hazT<=0){P.hazT=5+Math.random()*5;const ty=P.phase==='ride'?(Math.random()<.6?'surfer':'gull'):(Math.random()<.5?'fin':'gull');
   const D=40,off=Math.random()<.6?0:(Math.random()-.5)*14,hx=Math.sin(P.th)*D+Math.cos(P.th)*off,hz=Math.cos(P.th)*D-Math.sin(P.th)*off,sp=ty==='gull'?7:ty==='fin'?3:4,n=Math.hypot(hx,hz);
   haz.push({type:ty,x:hx,z:hz,vx:-hx/n*sp,vz:-hz/n*sp,y:ty==='gull'?4:0});if(ty!=='surfer'&&msgT<=0)say(t('dodge'),1.5);}}
 for(const h of haz){h.x+=(h.vx-mvx)*dt;h.z+=(h.vz-mvz)*dt;const dist=Math.hypot(h.x,h.z);if(h.type==='gull')h.y=0.8+3.2*Math.min(1,dist/30);
  const closing=(h.x*(h.vx-mvx)+h.z*(h.vz-mvz))<0;
  if(!h.done&&(dist<2.2||(!closing&&dist<12))){h.done=true;const hit=h.type==='gull'?(dist<2.2&&!K.down):dist<2.2;
   if(h.type==='fin'){if(hit){fall(t('finHit'));haz=[];return;}else{P.score+=30;say(t('finOk'),1);}}
   else if(h.type==='gull'){if(hit){SFX.bad();say(t('gullHit'),1.3);P.mood-=.12;if(!G.free)P.bat=Math.max(0,P.bat-3);P.score=Math.max(0,P.score-50);}else{P.score+=30;say(t('gullOk'),1);}}
   else{if(hit){SFX.bad();say(t('surfHit'),1.5);P.mood-=.15;P.combo=1;P.score=Math.max(0,P.score-150);}else{P.score+=40;say(t('surfOk'),1);}}}
  h.dist=dist;}
 haz=haz.filter(h=>h.dist===undefined||h.dist<60&&!(h.done&&h.dist>14));
 if(P.motor&&P.phase!=='ride'&&P.phase!=='swim'&&!G.free){P.bat-=100/g.cap*dt*(0.5+0.5*P.pwr);if(P.bat<=0){P.bat=0;endGame(t('batEmpty'));return;}}
 if(humG)humG.gain.setTargetAtTime(P.motor&&!muted?0.05:0,actx.currentTime,.05);if(hum)hum.frequency.setTargetAtTime(70+P.v*(P.phase==='paddle'?0.6:1.1),actx.currentTime,.1);
 if(P.phase==='paddle'){
  const tv=P.motor?95*(0.5+0.5*P.pwr):25;P.v+=(tv-P.v)*dt*2;P.prog+=P.v*Math.cos(P.th)*dt;if(P.prog<0)P.prog=0;
  if(P.diveCd>0)P.diveCd-=dt;
  if(K.down&&P.dive<=0&&P.diveCd<=0){P.dive=g.dive;P.diveCd=g.dive+0.35;say(t('duck'),.6);tone(180,.2,'sine',.15,90);}
  if(P.dive>0)P.dive-=dt;
  for(const w of waves){w.dx-=(55+P.v*0.6*Math.cos(P.th))*dt;
   if(!w.passed&&Math.abs(w.dx)<14*PX){if(P.dive>0){w.passed=true;P.score+=25;}else if(P.inv<=0){w.passed=true;P.prog=Math.max(0,P.prog-160);P.v=-60;SFX.splash();say(t('washed'),1.2);P.mood-=.1;P.inv=0.6;}}}
  waves=waves.filter(w=>w.dx>-W);const last=waves[waves.length-1];if(!last||last.dx<W*0.45)spawnWW((last?last.dx:W*0.3)+W*(0.6+Math.random()*0.3)*(G.free?FS.period:1));
  if(P.prog>900*PX)startGetup();
 } else if(P.phase==='getup'){
  P.getT+=dt;P.meter=(Math.sin(P.getT*2.6)+1)/2;const half=0.09*g.get;
  if(K.up&&!P.upLatch){P.upLatch=true;if(Math.abs(P.meter-0.5)<half){SFX.ok();say(t('stood'),1.2);P.score+=50;startFoil();}else{SFX.bad();say(t('miss'),1);if(!G.free)P.bat-=2;}}
  if(!K.up)P.upLatch=false;
 } else if(P.phase==='swim'){P.swimT-=dt;P.v*=0.95;if(P.swimT<=0)startPaddle();
 } else if(P.phase==='foil'){
  const tv=P.motor?g.vmax*(0.75+0.25*P.pwr):0;P.v+=(tv-P.v)*dt*(P.motor?1.2:0.35);
  const lift=g.lift*(P.v/66)**2;P.vy+=(-55+(K.up?95*lift:20*lift)+(K.down?-60:0))*dt;P.vy*=1-0.9*dt/g.stab;P.h+=P.vy*dt*PX;
  const mp=g.mast*PX;
  if(P.h>mp){fall(t('breach'));return;}
  if(P.h<0){if(P.vy<-25||P.v<33){fall(t('touch'));return;}P.h=0;P.vy=10;P.v*=0.8;}
  for(const w of waves){w.age+=dt;w.dx-=Math.max(22,w.spd+P.v*0.6*Math.cos(P.th))*dt;}
  waves=waves.filter(w=>w.dx>-W*1.2&&w.dx<W*1.5);
  if(!waves.length)nextSwell(W*(0.6+Math.random()*0.6)*(G.free?FS.period:1));
  P.catchable=null;for(const w of waves){if(w.dx>-20*PX&&w.dx<w.wf*1.6&&P.v>35)P.catchable=w;}
  if(P.catchable&&msgT<=0)say(t('catchW'),.3);
  if(P.catchable&&Math.cos(P.th)<0.3&&(!P.motor||Math.abs(P.sx)>0.45))tryCatch();
 } else if(P.phase==='ride'){
  const w=P.wave;w.age+=dt;P.v=w.spd;
  if(P.dropT>0){P.dropT-=dt;P.p-=0.75*dt;P.energy=Math.max(P.energy,0.8);}P.p+=((K.up?0.9:0)-(K.down?1.1:0)-0.12+Math.cos(P.th)*1.0)*dt*g.turn;if(P.climb>0){P.climb-=dt;P.p+=1.6*dt;}
  P.energy-=dt*(w.broken?0.09:0.14)/g.stab;
  if(P.p>0.98){P.p=0.98;if(!P.barrel){fall(t('breach'));return;}}
  if(P.p<0.05){P.p=0.05;P.energy-=dt*0.5;}
  if(P.barrel){const b=P.barrel;b.t+=dt;b.c=0.5+Math.sin(b.t*1.8)*0.18;if(Math.abs(P.p-b.c)>0.13){b.out+=dt;if(b.out>0.45){P.barrel=null;fall(t('swallowed'));return;}}else b.out=Math.max(0,b.out-dt);
   if(b.t>3.2){P.barrel=null;P.barrels++;addScore(2000,t('barrel'));P.mood=1;SFX.barrel();celebrate=2.5;w.hollow=false;P.energy=Math.min(1.5,P.energy+0.6);}}
  else if(w.hollow&&w.age>2.5&&!w.barrelDone){w.barrelDone=true;P.barrel={t:0,c:.5,out:0};say(t('barrelC'),2.5);tone(200,.5,'sine',.2,600);}
  if(carveEv&&!P.barrel){const since=P.time-P.lastMove;
   if(since<0.3*g.stab){fall(t('wobble'));return;}
   P.combo=since<2.6?Math.min(8,P.combo+1):1;P.maxCombo=Math.max(P.maxCombo,P.combo);P.lastMove=P.time;P.turnAnim=0.5;
   const base=(w.broken?1:0.7)*(w.A/(110*PX));
   if(P.p<0.3){addScore(100*base,t('bt'));P.climb=0.45;P.energy=Math.min(1.5,P.energy+0.35*g.turn);}
   else if(P.p>0.7){addScore(150*base*g.turn,t('cb'));P.p-=0.25;P.energy=Math.min(1.5,P.energy+0.25);}
   else{addScore(50*base,t('carve'));P.energy=Math.min(1.5,P.energy+0.1);}
   P.mood=Math.min(1,P.mood+.08);SFX.trick(P.combo);for(let i=0;i<10;i++)sprays.push({x:W/2,y:H*0.7,vx:(Math.random()-.3)*160,vy:-60-Math.random()*140,t:.8});}
  if(P.turnAnim>0)P.turnAnim-=dt;
  placeOnFace(w,P.p);
  if(P.energy<=0){say(t('lost'),1.8);P.phase='foil';P.h=g.mast*0.5*PX;P.vy=0;P.motor=false;w.dx=w.wf*0.8;P.combo=1;return;}
  if(w.age>(w.hollow?16:13)){addScore(200,t('close'));P.rides++;startPaddle();}
 }
 for(const f of floaters){f.t-=dt;f.y-=30*dt;}floaters=floaters.filter(f=>f.t>0);
 for(const s of sprays){s.t-=dt;s.x+=s.vx*dt;s.y+=s.vy*dt;s.vy+=300*dt;}sprays=sprays.filter(s=>s.t>0);
}
function tryCatch(){const w=P.catchable;if(!w||P.phase!=='foil')return;P.phase='ride';P.wave=w;waves=[w];P.p=0.85;P.climb=0;P.motor=false;P.lastDir=turnDir||1;P.th=(turnDir||1)>0?-(Math.PI/2+0.3):(Math.PI/2+0.3);P.turnAnim=0.5;P.dropT=0.7;P.energy=1;P.lastMove=P.time-1;P.climb=0;w.age=0;
 SFX.ok();say(w.broken?t('caught'):t('swell'),1.4);if(!G.free)P.bat=Math.min(100,P.bat+0);}

/* ---------- tekenen (eerste persoon) ---------- */
function lerpC(a,b,k){const pa=a.match(/\w\w/g).map(h=>parseInt(h,16)),pb=b.match(/\w\w/g).map(h=>parseInt(h,16));return 'rgb('+pa.map((v,i)=>Math.round(v+(pb[i]-v)*k)).join(',')+')';}
let yawX=0,rain=[];for(let i=0;i<90;i++)rain.push({x:Math.random(),y:Math.random(),s:.6+Math.random()*.6});
const CAM={th:0,h:1,hz:0,F:400};
function proj(x,z,y){const c=Math.cos(CAM.th),s=Math.sin(CAM.th),f=x*s+z*c,sd=x*c-z*s;if(f<0.35)return null;return [W/2+sd/f*CAM.F,CAM.hz+(CAM.h-y)/f*CAM.F,f];}
const XS=(()=>{const a=[];for(let i=-60;i<=60;i++){const u=i/60;a.push(Math.sign(u)*u*u*400);}return a;})();
function curlWave(z,top,tm,o){ // rustige krullende golf: doorschijnend blauwgroen, lip krult, schuim alleen bij breekpunt
 o=o||{};top*=2.2;const peel=o.peel===undefined?-1e9:o.peel,sg=o.dir||1,ww=!!o.ww,a=o.alpha||0.93;
 const pts=[];for(const x of XS){const q=(x-peel)*sg,broken=q<0;const k=Math.max(0,Math.min(1,(q+18)/18)),sm=k*k*(3-2*k);const t=(0.55+0.45*sm)*top*(1+0.05*Math.sin(x*0.07+tm*1.2));
  const d=Math.abs(q),bump=d<30?(1+0.12*Math.cos(d/30*Math.PI/2)):1;const tp=proj(x,z,t*bump),bs=proj(x,Math.max(z*0.5,z-top*0.9),0),lp=proj(x,Math.max(z*0.75,z-top*0.35),t*bump*0.85);pts.push(tp&&bs&&lp?{x,tp,bs,lp,broken}:null);}
 // aaneengesloten stukken
 let run=[];const runs=[];for(const p of pts){if(p)run.push(p);else if(run.length){runs.push(run);run=[];}}if(run.length)runs.push(run);
 for(const r of runs){if(r.length<2)continue;const mid=r[r.length>>1],yT=mid.tp[1],yB=mid.bs[1];
  const g=ctx.createLinearGradient(0,yB,0,yT);
  if(ww){g.addColorStop(0,'rgba(12,80,105,'+a+')');g.addColorStop(1,'rgba(70,170,180,'+a+')');}
  else{g.addColorStop(0,'rgba(6,58,82,'+a+')');g.addColorStop(0.55,'rgba(14,128,140,'+a+')');g.addColorStop(0.88,'rgba(70,205,190,'+(a*0.9)+')');g.addColorStop(1,'rgba(150,240,220,'+(a*0.85)+')');}
  ctx.beginPath();ctx.moveTo(r[0].tp[0],r[0].tp[1]);for(const p of r)ctx.lineTo(p.tp[0],p.tp[1]);for(let i=r.length-1;i>=0;i--)ctx.lineTo(r[i].bs[0],r[i].bs[1]+2);ctx.closePath();ctx.fillStyle=g;ctx.fill();
  // licht dat door de lip schijnt
  if(!ww){ctx.beginPath();for(let i=0;i<r.length;i++){const p=r[i],y=p.tp[1]+(p.bs[1]-p.tp[1])*0.18;i?ctx.lineTo(p.tp[0],y):ctx.moveTo(p.tp[0],y);}for(let i=r.length-1;i>=0;i--)ctx.lineTo(r[i].tp[0],r[i].tp[1]);ctx.closePath();ctx.fillStyle='rgba(180,255,235,.22)';ctx.fill();}
  // textuurlijnen op de wand
  ctx.strokeStyle='rgba(255,255,255,.10)';ctx.lineWidth=1;for(const k of [0.35,0.6,0.8]){ctx.beginPath();for(let i=0;i<r.length;i+=2){const p=r[i],y=p.bs[1]+(p.tp[1]-p.bs[1])*k+Math.sin(p.x*0.2+tm*2+k*9)*1.5;i?ctx.lineTo(p.tp[0],y):ctx.moveTo(p.tp[0],y);}ctx.stroke();}
  // krullende lip (overhang) voorbij het breekpunt, niet over de hele lengte
  if(!ww){ctx.beginPath();let on=false;const seg=[];for(const p of r){const d=(p.x-peel)*sg;if(d>-2&&d<60){seg.push(p);}}
   if(seg.length>1){ctx.moveTo(seg[0].tp[0],seg[0].tp[1]);for(const p of seg){const d=Math.max(0,1-((p.x-peel)*sg)/60);ctx.lineTo(p.tp[0]+(p.lp[0]-p.tp[0])*d,p.tp[1]+(p.lp[1]-p.tp[1])*d*0.3);}
    for(let i=seg.length-1;i>=0;i--)ctx.lineTo(seg[i].tp[0],seg[i].tp[1]);ctx.closePath();ctx.fillStyle='rgba(120,230,215,.55)';ctx.fill();}}
  // dunne schuimlijn alleen op de kam bij het breekpunt; wit water alleen waar hij gebroken is
  ctx.strokeStyle='rgba(255,255,255,.85)';ctx.lineWidth=1.6;ctx.beginPath();let st=false;
  for(const p of r){const d=(p.x-peel)*sg;if(d>-4&&d<14){st?ctx.lineTo(p.tp[0],p.tp[1]):(ctx.moveTo(p.tp[0],p.tp[1]),st=true);}else st=false;}ctx.stroke();
  ctx.fillStyle='rgba(245,252,255,.88)';for(let i=0;i<r.length;i+=2){const p=r[i];if(!p.broken&&!ww)continue;const rr=Math.max(1.5,Math.min(14,CAM.F/p.tp[2]*0.16));ctx.beginPath();ctx.arc(p.tp[0],p.tp[1]+rr*0.4+Math.sin(tm*5+i)*rr*0.25,rr,0,7);ctx.fill();}
  // beetje spray bij de piek
  ctx.fillStyle='rgba(255,255,255,.7)';for(const p of r){const d=Math.abs(p.x-peel);if(d<6){for(let k=0;k<3;k++){const ph=(tm*1.7+k*0.33+p.x)%1;ctx.fillRect(p.tp[0]+Math.sin(k*7+tm*3)*8,p.tp[1]-ph*CAM.F/p.tp[2]*0.6,2,2);}}}
 }}
function crest(z,top,fill,lipCol,foam,tm,bump){ // lange golfkam op afstand z (camera-relatief), evenwijdig aan de kust
 top*=2.2;let seg=[];const segs=[];for(const x of XS){const y=top*(1+(bump||0)*Math.sin(x*0.08+tm*1.5));const a=proj(x,z,y),b=proj(x,z,0);if(a&&b)seg.push([a,b]);else if(seg.length){segs.push(seg);seg=[];}}if(seg.length)segs.push(seg);
 for(const sg of segs){if(sg.length<2)continue;ctx.beginPath();ctx.moveTo(sg[0][0][0],sg[0][0][1]);for(const p of sg)ctx.lineTo(p[0][0],p[0][1]);for(let i=sg.length-1;i>=0;i--)ctx.lineTo(sg[i][1][0],sg[i][1][1]+2);ctx.closePath();ctx.fillStyle=fill;ctx.fill();
  if(lipCol){ctx.strokeStyle=lipCol;ctx.lineWidth=Math.max(1.5,Math.min(9,CAM.F/sg[sg.length>>1][0][2]*0.12));ctx.beginPath();ctx.moveTo(sg[0][0][0],sg[0][0][1]);for(const p of sg)ctx.lineTo(p[0][0],p[0][1]);ctx.stroke();}
  if(foam){ctx.fillStyle='rgba(255,255,255,.8)';for(let i=0;i<sg.length;i+=3){const p=sg[i][0];const r=Math.min(18,CAM.F/p[2]*0.18);ctx.beginPath();ctx.arc(p[0],p[1]+r*0.3+Math.sin(tm*6+i)*r*0.2,r,0,7);ctx.fill();}}}}
function draw(){
 const tm=performance.now()/1000;
 if(G.mode==='over'&&G.party){drawParty(tm);return;}
 const play=P&&G.mode==='play',mood=play?P.mood:0.75;

 if(msgT>0&&msg){ctx.font='700 '+(15*Math.min(PX,1.2)|0)+'px system-ui';ctx.textAlign='center';const y=H*0.62;const tw=Math.min(W-20,ctx.measureText(msg).width+24);ctx.fillStyle='rgba(3,25,45,.75)';ctx.fillRect((W-tw)/2,y-15,tw,30);ctx.fillStyle='#fff';ctx.fillText(msg,W/2,y,W-30);}
 if(G.paused){ctx.fillStyle='rgba(0,0,0,.5)';ctx.fillRect(0,0,W,H);ctx.fillStyle='#fff';ctx.font='800 32px system-ui';ctx.textAlign='center';ctx.fillText(t('pause'),W/2,H/2);}
 ctx.restore();}
function drawBarrel(tm){const b=P.barrel;ctx.save();
 const g=ctx.createRadialGradient(W*0.5,H*0.42,10,W*0.5,H*0.42,Math.max(W,H)*0.7);g.addColorStop(0,'rgba(255,255,230,.97)');g.addColorStop(0.18,'rgba(120,230,240,.8)');g.addColorStop(0.55,'rgba(10,110,140,.95)');g.addColorStop(1,'rgba(2,30,50,1)');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
 ctx.strokeStyle='rgba(255,255,255,.35)';ctx.lineWidth=3;for(let i=0;i<14;i++){const a=i/14*Math.PI*2+tm*1.2;ctx.beginPath();ctx.ellipse(W*0.5,H*0.42,W*(0.2+0.25*((i+tm*2)%4)/4),H*(0.15+0.2*((i+tm*2)%4)/4),0,a,a+0.8);ctx.stroke();}
 ctx.fillStyle='rgba(255,255,255,.88)';for(let x=0;x<W;x+=14){ctx.beginPath();ctx.arc(x,18+Math.sin(x*0.05+tm*8)*8,10,0,7);ctx.fill();}
 const growth=Math.min(1,b.t/3.2);ctx.fillStyle='rgba(255,255,220,'+(0.4+growth*0.5)+')';ctx.beginPath();ctx.ellipse(W*0.5,H*0.42,20+growth*W*0.25,14+growth*H*0.18,0,0,7);ctx.fill();
 const lane=y=>H*0.8-(y)*H*0.55;ctx.strokeStyle='#ffe066';ctx.lineWidth=3;ctx.setLineDash([8,6]);ctx.strokeRect(W*0.08,lane(b.c+0.13),W*0.84,lane(b.c-0.13)-lane(b.c+0.13));ctx.setLineDash([]);
 const ry=lane(P.p);ctx.fillStyle=b.out>0?'#ff5a5a':'#fff';ctx.beginPath();ctx.moveTo(W*0.5-18,ry+8);ctx.lineTo(W*0.5,ry-12);ctx.lineTo(W*0.5+18,ry+8);ctx.closePath();ctx.fill();
 ctx.font='800 '+(20*PX|0)+'px system-ui';ctx.textAlign='center';ctx.fillStyle='#fff';ctx.fillText('BARREL '+Math.max(0,3.2-b.t).toFixed(1)+'s  ↑/↓',W/2,H*0.14);ctx.restore();}
function drawParty(tm){const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#3b1d5e');g.addColorStop(0.45,'#f2643a');g.addColorStop(0.62,'#ffd36b');g.addColorStop(0.63,'#1b6f8f');g.addColorStop(0.75,'#e3c48a');g.addColorStop(1,'#c9a46a');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
 ctx.fillStyle='#ffe28a';ctx.beginPath();ctx.arc(W*0.5,H*0.62,50*PX,Math.PI,0);ctx.fill();
 const fx=W*0.5,fy=H*0.86;ctx.fillStyle='#5b3a1e';ctx.fillRect(fx-34,fy,68,8);for(let i=0;i<6;i++){const f=Math.sin(tm*10+i*2)*8;ctx.fillStyle=i%2?'#ffb703':'#fb5607';ctx.beginPath();ctx.moveTo(fx-26+i*10,fy);ctx.quadraticCurveTo(fx-30+i*10,fy-30-f,fx-20+i*10,fy-46-f-(i%3)*10);ctx.quadraticCurveTo(fx-14+i*10,fy-20,fx-16+i*10,fy);ctx.fill();}
 const cols=['#e63946','#2a9d8f','#e9c46a','#8338ec','#ff006e','#3a86ff'];
 for(let i=0;i<6;i++){const side=i<3?-1:1,k=i%3,x=fx+side*(70+k*55)*PX,y=fy+6,jump=Math.abs(Math.sin(tm*4+i))*8,hair=i%2;ctx.save();ctx.translate(x,y-jump);ctx.scale(PX,PX);
  ctx.strokeStyle='#222';ctx.lineWidth=4;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(-6,0);ctx.lineTo(0,-22);ctx.lineTo(6,0);ctx.stroke();ctx.fillStyle=cols[i];ctx.beginPath();ctx.roundRect(-9,-48,18,28,6);ctx.fill();
  const arm=-side;ctx.beginPath();ctx.moveTo(0,-44);ctx.lineTo(arm*16,-62);ctx.stroke();ctx.fillStyle='#e0a96d';ctx.beginPath();ctx.arc(0,-56,9,0,7);ctx.fill();
  if(hair){ctx.fillStyle='#6b3e1e';ctx.beginPath();ctx.arc(0,-58,10,Math.PI,0);ctx.fill();ctx.fillRect(-10,-58,4,16);ctx.fillRect(6,-58,4,16);}
  ctx.fillStyle='#ffc93c';ctx.fillRect(arm*16-6,-78,12,16);ctx.fillStyle='#fff';ctx.beginPath();ctx.ellipse(arm*16,-78,8,4,0,0,7);ctx.fill();ctx.restore();}
 ctx.save();ctx.textAlign='center';ctx.font='900 '+(44*PX|0)+'px system-ui';ctx.lineWidth=7;ctx.strokeStyle='#5b1a00';const s=1+Math.sin(tm*5)*0.06;ctx.translate(W/2,H*0.7);ctx.scale(s,s);ctx.strokeText(t('proost'),0,0);ctx.fillStyle='#ffe066';ctx.fillText(t('proost'),0,0);ctx.restore();
 if(sprays.length<120)sprays.push({x:fx+(Math.random()-.5)*30,y:fy-30,vx:(Math.random()-.5)*40,vy:-60-Math.random()*60,t:1.5});for(const p of sprays){p.t-=1/60;p.x+=p.vx/60;p.y+=p.vy/60;ctx.fillStyle='rgba(255,200,80,'+Math.max(0,p.t)+')';ctx.fillRect(p.x,p.y,3,3);}sprays=sprays.filter(p=>p.t>0);}

/* ---------- menu's ---------- */
const ov=document.getElementById('ov');function hideOv(){ov.classList.add('hide');}
function showMenu(){G.party=0;ov.style.background='';ov.style.alignItems='';G.mode='menu';document.body.classList.remove('playing');ov.classList.remove('hide');
 ov.innerHTML=`<div class="card"><h1>FOILASSIST!</h1><p>${t('sub')}</p><p style="font-size:12px">${t('help')}</p>
 <button class="big" id="mS">${t('start')}</button><button class="big" id="mF" style="background:#4fd1ff;box-shadow:0 4px 0 #1478a0">${t('free')}</button>
 <p style="font-size:12px">${t('freeTxt')}</p><p class="stats">${t('hiS')}: ${t('start')} ${hi.sessie} · ${t('free')} ${hi.freeride}</p></div>`;
 document.getElementById('mS').onclick=()=>showGear(false);document.getElementById('mF').onclick=()=>showGear(true);}
function showGear(free){G.party=0;ov.style.background='';ov.style.alignItems='';G.mode='gear';const L=lang,ro=(key,lbl,items)=>`<div class="row"><b>${t(lbl)}</b><div class="opts">${items.map((it,i)=>`<button class="opt${sel[key]===i?' sel':''}" data-k="${key}" data-i="${i}">${it[0]}<small>${it[1]}</small></button>`).join('')}</div></div>`;
 ov.innerHTML=`<div class="card"><h1 style="font-size:28px">${t('gear')}</h1>
 ${ro('wing','wing',[[t('wS'),t('wSd')],[t('wM'),t('wMd')],[t('wL'),t('wLd')]])}
 ${ro('stab','stab',[[t('sS'),t('sSd')],[t('sL'),t('sLd')]])}
 ${ro('mast','mast',[['65 cm',t('m65d')],['75 cm',t('m75d')],['85 cm',t('m85d')]])}
 ${ro('board','board',[[t('bS'),t('bSd')],[t('bM'),t('bMd')],[t('bL'),t('bLd')]])}
 ${ro('bat','bat',[[t('aS'),t('aSd')],[t('aL'),t('aLd')]])}
 ${free?`<div class="row"><b>${t('fsT')}</b>${[['wave','fsW',0.5,1.6],['speed','fsS',0.6,1.6],['period','fsP',0.5,1.6],['steer','fsSt',0.5,1.6]].map(([k,l,a,b])=>`<label class="sl"><span>${t(l)}</span><input type="range" min="${a}" max="${b}" step="0.05" value="${FS[k]}" data-f="${k}"><em>${(+FS[k]).toFixed(2)}</em></label>`).join('')}<label class="sl"><input type="checkbox" id="fH" ${FS.haz?'checked':''} style="flex:0"> ${t('fsH')}</label></div>`:''}
 <p class="stats" id="gs">${T[L].statsT(gear())}</p>
 <button class="sec" id="gB">${t('back')}</button><button class="big" id="gG">${t('go')}</button></div>`;
 ov.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{sel[b.dataset.k]=+b.dataset.i;lsSet('fa-gear',JSON.stringify(sel));tone(600,.05,'square',.08);showGear(free);});
 ov.querySelectorAll('input[data-f]').forEach(i=>i.oninput=()=>{FS[i.dataset.f]=+i.value;i.nextElementSibling.textContent=(+i.value).toFixed(2);lsSet('fa-free',JSON.stringify(FS));});const fh=document.getElementById('fH');if(fh)fh.onchange=()=>{FS.haz=fh.checked;lsSet('fa-free',JSON.stringify(FS));};
 document.getElementById('gB').onclick=showMenu;document.getElementById('gG').onclick=()=>{lsSet('fa-gear',JSON.stringify(sel));newGame(free);};}
function showOver(why,nh){ov.classList.remove('hide');ov.style.background=G.party?'rgba(3,20,38,.25)':'';ov.style.alignItems=G.party?'flex-start':'';ov.innerHTML=`<div class="card"><h1 style="font-size:32px">${t('over')}</h1><p>${why}</p>${G.party?`<p style="color:#ffe066;font-weight:800">${t('party')}</p>`:''}
 <p style="font-size:26px;font-weight:800;color:#fff">${t('score')}: ${P.score}${nh?' 🏆':''}</p><p>${t('hiS')}: ${hi[G.free?'freeride':'sessie']} · ${t('combo')} x${P.maxCombo} · BARREL ${P.barrels}</p>
 <button class="big" id="oA">${t('again')}</button><button class="sec" id="oM">${t('back')}</button></div>`;
 document.getElementById('oA').onclick=()=>showGear(G.free);document.getElementById('oM').onclick=showMenu;}
function togglePause(){if(G.mode!=='play')return;G.paused=!G.paused;}
document.getElementById('bPause').onclick=e=>{togglePause();};
const bL=document.getElementById('bLang'),bM=document.getElementById('bMute');
function syncTop(){bL.textContent=lang==='nl'?'EN':'NL';bM.textContent=muted?'🔇':'🔊';document.documentElement.lang=lang;}
bL.onclick=()=>{lang=lang==='nl'?'en':'nl';lsSet('fa-lang',lang);syncTop();if(G.mode==='menu')showMenu();else if(G.mode==='gear')showGear(G.free);};
bM.onclick=()=>{muted=!muted;lsSet('fa-mute',muted?'1':'0');if(master)master.gain.value=muted?0:.8;syncTop();};
syncTop();showMenu();

/* ---------- lus ---------- */
let last=performance.now();
function loop(now){requestAnimationFrame(loop);try{step(now);}catch(e){if(DEBUG)console.error(e);}}
function step(now){const dt=Math.min(0.05,(now-last)/1000);last=now;
 if(G.mode==='play'&&!G.paused)update(dt);
 
 draw();}
requestAnimationFrame(loop);
if(DEBUG)window.__fa={G,get P(){return P;},sel,newGame,K,set:(o)=>Object.assign(P,o),press:(k)=>{if(k==='motor')motorPress=true;if(k==='turn')turnPress=true;},
 stickX:()=>stickX,setTh:(d)=>{P.th=d*Math.PI/180;},forceRide:(hollow)=>{startFoil();waves=[];nextSwell(0);const w=waves[0];w.hollow=!!hollow;w.dx=10;P.v=w.spd;P.catchable=w;tryCatch();},startGetup:()=>startGetup(),startFoil:()=>startFoil(),waves:()=>waves.map(w=>Math.round(w.dx)),swellAt:(dx)=>{waves=[{kind:"swell",dx:dx*PX,A:110*PX,wf:110*PX,spd:70,broken:true,hollow:false,age:0}];},haz:(ty)=>haz.push({type:ty,x:Math.sin(P.th)*15,z:Math.cos(P.th)*15,vx:-Math.sin(P.th)*4,vz:-Math.cos(P.th)*4,y:ty==='gull'?3:0}),end:(sc)=>{P.score=sc;endGame('test');},mood:(m)=>P.mood=m};
})();
