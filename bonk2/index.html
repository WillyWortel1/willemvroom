<script>
'use strict';
(function(){
const DEBUG=new URLSearchParams(location.search).get('debug')==='1';
const isTouch=('ontouchstart' in window)||navigator.maxTouchPoints>0||(window.matchMedia&&matchMedia('(pointer:coarse)').matches);
function lsGet(k,d){try{const v=localStorage.getItem(k);return v===null?d:v;}catch(e){return d;}}
function lsSet(k,v){try{localStorage.setItem(k,v);}catch(e){}}
let muted=lsGet('bonkhh-mute','0')==='1';
const hi={A:parseInt(lsGet('bonkhh-hi-A','0'),10)||0,B:parseInt(lsGet('bonkhh-hi-B','0'),10)||0};

/* ---------- geluid: piëzo-piepjes, robuuste mobiele ontgrendeling ---------- */
let actx=null,master=null,unlocked=false,silentEl=null,audioOkOnce=false,nodeCount=0;
const isIOS=/iP(hone|ad|od)/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
function silentWavURI(){ // 0,5 s stille 8-bit mono WAV, in JS gemaakt (geen extern bestand)
  const sr=8000,n=4000,b=new Uint8Array(44+n),v=new DataView(b.buffer);const w=(o,s)=>{for(let i=0;i<s.length;i++)b[o+i]=s.charCodeAt(i);};
  w(0,'RIFF');v.setUint32(4,36+n,true);w(8,'WAVE');w(12,'fmt ');v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,1,true);
  v.setUint32(24,sr,true);v.setUint32(28,sr,true);v.setUint16(32,1,true);v.setUint16(34,8,true);w(36,'data');v.setUint32(40,n,true);b.fill(128,44);
  let s='';for(let i=0;i<b.length;i++)s+=String.fromCharCode(b[i]);return 'data:audio/wav;base64,'+btoa(s);}
function audio(){ // altijd synchroon vanuit een gebruikersgebaar aanroepen
  try{
    const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;
    if(navigator.audioSession){try{if(navigator.audioSession.type!=='playback')navigator.audioSession.type='playback';}catch(e){}}
    if(!actx){actx=new AC();master=actx.createGain();master.gain.value=muted?0:0.9;master.connect(actx.destination);
      actx.onstatechange=()=>{if(actx.state==='running')audioOkOnce=true;};}
    if(actx.state!=='running'){const p=actx.resume();if(p&&p.catch)p.catch(()=>{});}
    if(!unlocked){unlocked=true;
      const b=actx.createBuffer(1,1,22050),s=actx.createBufferSource();s.buffer=b;s.connect(actx.destination);s.start(0);
      if(isIOS&&!navigator.audioSession){try{silentEl=document.createElement('audio');silentEl.src=silentWavURI();silentEl.loop=true;silentEl.setAttribute('playsinline','');silentEl.setAttribute('x-webkit-airplay','deny');silentEl.preload='auto';}catch(e){silentEl=null;}}
    }
    if(silentEl&&silentEl.paused&&!document.hidden){const p=silentEl.play();if(p&&p.catch)p.catch(()=>{});}
    if(actx.state==='running')audioOkOnce=true;
  }catch(e){}
}
['pointerdown','touchstart','touchend','mousedown','click','keydown'].forEach(t=>document.addEventListener(t,audio,{capture:true,passive:true}));
document.addEventListener('visibilitychange',()=>{if(!actx)return;
  if(document.hidden){if(silentEl)silentEl.pause();if(actx.state==='running'){const p=actx.suspend();if(p&&p.catch)p.catch(()=>{});}}
  else{const p=actx.resume();if(p&&p.catch)p.catch(()=>{});if(silentEl&&silentEl.paused){const q=silentEl.play();if(q&&q.catch)q.catch(()=>{});}}});
function canPlay(){return !muted&&actx&&master;}
function env(g,t,d,vol){vol=Math.min(.35,(vol||.05)*1.8);g.gain.setValueAtTime(0.0001,t);g.gain.linearRampToValueAtTime(vol,t+.006);g.gain.setValueAtTime(vol,t+Math.max(.01,d*.35));g.gain.exponentialRampToValueAtTime(.0001,t+d);}
function tone(f,d,type,vol,slide,delay){if(!canPlay())return;try{d=Math.max(.06,d);const t=actx.currentTime+.01+(delay||0);const o=actx.createOscillator(),g=actx.createGain();nodeCount+=2;o.type=type||'square';o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,f+slide),t+d);env(g,t,d,vol);o.connect(g);g.connect(master);o.start(t);o.stop(t+d+.05);}catch(e){}}
function noise(d,vol,delay){if(!canPlay())return;try{const t=actx.currentTime+.01+(delay||0);const n=Math.floor(actx.sampleRate*d),buf=actx.createBuffer(1,n,actx.sampleRate),a=buf.getChannelData(0);for(let i=0;i<n;i++)a[i]=(Math.random()*2-1)*(1-i/n);const s=actx.createBufferSource();s.buffer=buf;const g=actx.createGain();nodeCount+=2;g.gain.value=Math.min(.4,vol*1.6);s.connect(g);g.connect(master);s.start(t);}catch(e){}}
function beep(f,ms,delay,vol){tone(f,ms/1000,'square',vol||.05,0,(delay||0)/1000);}
function melody(notes,len,vol){notes.forEach((f,i)=>{if(f)beep(f,len*0.85,i*len,vol);});}
const sfx={
 step(){beep(1568,60,0,.04);},
 tick(){beep(988,60,0,.025);},
 jump(){beep(2093,90);},
 point(){beep(2637,70);beep(3136,70,80);},
 miss(){beep(392,220);beep(392,220,300);beep(392,320,600);},
 win(){melody([1047,1319,1568,2093,0,1568,2093],110);},
 start(){melody([1568,0,1568,2093],90);},
 over(){melody([784,659,523,392,0,330],160);},
 key(){beep(1319,60,0,.04);},
 throw(){beep(659,70,0,.04);}
};

/* ---------- schaal ---------- */
const dev=document.getElementById('dev');
let K=2;
function fit(){
  const s=Math.min(innerWidth/480,innerHeight/580)*(innerWidth>innerHeight?0.96:1);
  dev.style.transform='translate(-50%,-50%) scale('+s+')';
  const k=Math.max(1,Math.min(4,Math.ceil(s*0.8*(window.devicePixelRatio||1))));
  if(k!==K||!bgT){K=k;for(const c of [cT,cB]){c.width=320*K;c.height=220*K;}buildBg();}
}
addEventListener('resize',fit);addEventListener('orientationchange',()=>setTimeout(fit,100));

/* ---------- LCD-segmenten ---------- */
const cT=document.getElementById('ct'),cB=document.getElementById('cb'),xT=cT.getContext('2d'),xB=cB.getContext('2d');
const SEG=[];
function seg(id,scr,fn){SEG.push({id:id,scr:scr,fn:fn});}
function P(ctx,hole){ // padbouwer: vaste vormen, gaten in een tweede pass
  return {
   r(x,y,w,h){if(!hole)ctx.rect(x,y,w,h);},
   c(x,y,r){if(!hole){ctx.moveTo(x+r,y);ctx.arc(x,y,r,0,Math.PI*2);}},
   e(x,y,rx,ry){if(!hole){ctx.moveTo(x+rx,y);ctx.ellipse(x,y,rx,ry,0,0,Math.PI*2);}},
   poly(a){if(!hole){ctx.moveTo(a[0],a[1]);for(let i=2;i<a.length;i+=2)ctx.lineTo(a[i],a[i+1]);ctx.closePath();}},
   hr(x,y,w,h){if(hole)ctx.rect(x,y,w,h);},
   hc(x,y,r){if(hole){ctx.moveTo(x+r,y);ctx.arc(x,y,r,0,Math.PI*2);}},
   he(x,y,rx,ry){if(hole){ctx.moveTo(x+rx,y);ctx.ellipse(x,y,rx,ry,0,0,Math.PI*2);}},
   t(s,x,y,size,al){if(!hole){ctx.font='900 '+size+'px Arial,Helvetica,sans-serif';ctx.textAlign=al||'left';ctx.fillText(s,x,y);}}
  };
}
// figuren
function bouwer(p,x,y,d){
  p.r(x-6,y-13,4,13);p.r(x+2,y-13,4,13);p.r(x-7+(d>0?1:-1),y-3,6,3);p.r(x+1+(d>0?1:-1),y-3,6,3);
  p.r(x-7,y-26,14,14);p.r(x-11,y-25,4,11);p.r(x+7,y-25,4,11);
  p.c(x+d,y-31,5);p.e(x,y-35,7,4);p.r(x-8+(d>0?3:-3),y-35,16,2);
  p.hr(x+d*3-1,y-32,2,2);p.hr(x-1,y-24,2,9);
}
function bouwerJump(p,x,y,d){
  y-=22;p.r(x-8,y-14,6,6);p.r(x-8,y-9,4,6);p.r(x+2,y-14,6,6);p.r(x+4,y-9,4,6);
  p.r(x-7,y-26,14,13);p.r(x-12,y-36,4,12);p.r(x+8,y-36,4,12);
  p.c(x+d,y-31,5);p.e(x,y-35,7,4);p.r(x-8+(d>0?3:-3),y-35,16,2);
  p.hr(x+d*3-1,y-32,2,2);p.hr(x-1,y-24,2,9);
}
function bouwerClimb(p,x,y){
  p.r(x-8,y-14,4,14);p.r(x+4,y-10,4,10);p.r(x-7,y-26,14,13);
  p.r(x-12,y-38,4,14);p.r(x+8,y-34,4,12);p.c(x,y-31,5);p.e(x,y-35,7,4);p.r(x-8,y-35,16,2);
}
function bouwerPull(p,x,y){
  p.r(x-6,y-13,4,13);p.r(x+2,y-13,4,13);p.r(x-8,y-3,6,3);p.r(x,y-3,6,3);
  p.r(x-7,y-26,14,14);p.poly([x-7,y-24,x-24,y-30,x-24,y-26,x-7,y-19]);p.r(x+7,y-25,4,11);
  p.c(x-1,y-31,5);p.e(x,y-35,7,4);p.r(x-11,y-35,16,2);p.hr(x-5,y-32,2,2);
}
function barrel(p,x,y){p.e(x,y-8,8,8);p.hr(x-8,y-11,16,1.6);p.hr(x-8,y-6,16,1.6);p.hc(x,y-8,1.5);}
function barrelSide(p,x,y){p.r(x-9,y-14,18,13);p.hr(x-9,y-11,18,1.6);p.hr(x-9,y-5,18,1.6);}
function bonk(p,x,y,pose){
  p.r(x-18,y-12,12,12);p.r(x+6,y-12,12,12);p.e(x,y-30,22,19);p.he(x,y-28,11,11);
  p.c(x,y-56,12);p.c(x-12,y-60,4);p.c(x+12,y-60,4);p.he(x,y-51,7,4);p.hc(x-4,y-59,1.8);p.hc(x+4,y-59,1.8);
  if(pose==='hold'){p.r(x-28,y-82,9,36);p.r(x+19,y-82,9,36);p.e(x,y-84,17,9);p.he(x,y-86,17,1);p.he(x,y-81,17,1);}

let locks=[false,false,false,false],mode='time',game='A',score=0,misses=0,player=START,jumping=false,jumpUntil=0,barrels=[],nextTick=0,throwIn=3,bonkPose='idle',bonkPoseT=0,
    tBlocks=8,nextBlock=0,phaseT=0,frozen=false,lastNow=0,missCleared=false;
const BLOCK_MS=5000;
function tickMs(){const base=game==='A'?650:460,min=game==='A'?260:190;return Math.max(min,base-Math.floor(score/25)*22);}
function gap(){const lo=game==='A'?3:2,hi=game==='A'?6:4;return Math.max(2,lo+Math.floor(Math.random()*(hi-lo+1))-Math.floor(score/150));}
function newGame(g){game=g;score=0;misses=0;missCleared=false;locks=[false,false,false,false];resetRound(performance.now());mode='play';sfx.start();}
function resetRound(now){player=START;jumping=false;barrels=[];throwIn=3;bonkPose='idle';tBlocks=8;nextBlock=now+BLOCK_MS;nextTick=now+tickMs()+400;}
function addScore(n){const before=score;score=(score+n)%10000;if(!missCleared&&before<300&&score>=300&&misses){misses=0;missCleared=true;sfx.win();}}
function miss(now){if(mode!=='play')return;mode='miss';phaseT=now;misses++;sfx.miss();}
function barrelAt(id){return barrels.find(b=>BPATH[b.i]===id);}
function barrelTick(now){
  sfx.tick();
  for(let k=barrels.length-1;k>=0;k--){const b=barrels[k];b.i++;b.dodged=false;if(b.i>=BPATH.length)barrels.splice(k,1);}
  if(--throwIn<=0){barrels.push({i:0,dodged:false});bonkPose='throw';bonkPoseT=now;throwIn=gap();sfx.throw();}
  else if(throwIn===1){bonkPose='hold';}
  else if(bonkPose==='throw'&&now-bonkPoseT>tickMs()*0.8)bonkPose='idle';
  const b=barrelAt(player);
  if(b){if(jumping&&C[player].type==='walk'){b.dodged=true;addScore(1);sfx.point();}else miss(now);}
}
function tryMove(dir,now){
  if(mode!=='play'||jumping)return;
  const t=C[player].n[dir];if(!t)return;
  player=t;sfx.step();
  const b=barrelAt(player);if(b&&!b.dodged)miss(now);
}
function tryJump(now){
  if(mode!=='play'||jumping)return;
  if(C[player].type!=='walk')return;
  jumping=true;jumpUntil=now+Math.max(420,tickMs()*1.15);sfx.jump();
}
function chainAt(id){const i=CHAIN.indexOf(id);return i>=0&&!locks[i]?i:-1;}
function unhook(i,now){locks[i]=true;addScore(5);sfx.point();
  if(locks.every(Boolean)){mode='win';phaseT=now;sfx.win();}else{mode='unhook';phaseT=now;}}
function update(now){
  lastNow=now;
  if(mode==='play'){
    if(jumping&&now>=jumpUntil){jumping=false;const b=barrelAt(player);if(b&&!b.dodged)miss(now);else{const ci=chainAt(player);if(ci>=0)unhook(ci,now);}}
    if(!frozen&&mode==='play'&&now>=nextTick){nextTick=now+tickMs();barrelTick(now);}
    if(!frozen&&mode==='play'&&now>=nextBlock){nextBlock=now+BLOCK_MS;tBlocks--;if(tBlocks<=0)miss(now);}
  } else if(mode==='miss'){
    if(now-phaseT>1900){if(misses>=3){mode='over';phaseT=now;if(score>hi[game]){hi[game]=score;lsSet('bonkhh-hi-'+game,String(score));}sfx.over();}else{resetRound(now);mode='play';}}
  } else if(mode==='unhook'){
    if(now-phaseT>900){addScore(tBlocks);resetRound(now);mode='play';}
  } else if(mode==='win'){
    if(now-phaseT>3400){addScore(20+tBlocks*2);locks=[false,false,false,false];resetRound(now);mode='play';}
  }
  if(held&&mode==='play'&&now>=repeatAt){repeatAt=now+200;tryMove(held,now);}
}
function clockStr(){const d=new Date();return String(d.getHours()).padStart(2,' ')+String(d.getMinutes()).padStart(2,'0');}
function showDigits(set,str){str=str.padStart(4,' ').slice(-4);for(let i=0;i<4;i++)for(const k of DIG[str[i]]||'')set.add('d'+i+k);}
function activeSet(now){
  const a=new Set();
  if(mode==='time'){
    const sec=Math.floor(Date.now()/1000);a.add('tijd');showDigits(a,clockStr());if(Date.now()%1000<500)a.add('colon');
    const demo=['r0s0','r0s1','r0s2','r0s3','r0s4','r0s5','r0s4','r0s3','r0s2','r0s1'][sec%10];a.add('p_'+demo);
    a.add('bonk_'+['idle','hold','throw','idle'][sec%4]);a.add('cageUp');for(let i=0;i<4;i++)a.add((sec%8>i+3?'open':'lock')+i);
    a.add('b_'+BPATH[(sec*1)%BPATH.length]);
    if(isTouch&&!muted&&!audioOkOnce&&!(actx&&actx.state==='running')&&Math.floor(now/600)%3!==0)a.add('tik');
    return a;}
  a.add(game==='A'?'gameA':'gameB');
  if(mode==='over'){const showHi=Math.floor((now-phaseT)/1500)%2===1;showDigits(a,String(showHi?hi[game]:score));if(showHi)a.add('hiTxt');a.add('over');a.add('bonk_angry');a.add('cageUp');for(let i=0;i<4;i++)a.add((locks[i]?'open':'lock')+i);
    for(let i=0;i<3;i++)a.add('miss'+i);a.add('missTxt');return a;}
  showDigits(a,String(score));
  for(let i=0;i<misses;i++)a.add('miss'+i);if(misses)a.add('missTxt');
  for(let i=0;i<tBlocks;i++)a.add('tb'+i);
  for(const b of barrels)a.add('b_'+BPATH[b.i]);
  for(let i=0;i<4;i++)a.add((locks[i]?'open':'lock')+i);
  if(mode==='win'){const t=now-phaseT;a.add('bonk_angry');a.add('j_'+player);
    if(t<700)a.add('cageUp');else{a.add('cageOpen');if(t>1200){a.add('pipFree');if(Math.floor(t/250)%2===0)a.add('heart');}}
  } else if(mode==='unhook'){a.add('cageUp');a.add('bonk_angry');a.add('j_'+player);
  } else {
    a.add('cageUp');a.add('bonk_'+bonkPose);
    const blinkOff=mode==='miss'&&Math.floor((now-phaseT)/180)%2===1;
    if(!blinkOff)a.add((jumping?'j_':'p_')+player);
  }
  return a;
}

(function(){
  const pad=document.getElementById('pad'),arm={up:'aU',down:'aD',left:'aL',right:'aR'};
  const DEAD=12,VCOS=Math.cos(35*Math.PI/180);let id=null,dir=null;
  function setDir(d){if(d===dir)return;dir=d;for(const k in arm)document.getElementById(arm[k]).classList.toggle('on',d===k);held=null;dirDown(d);}
  function upd(e){const r=pad.getBoundingClientRect(),dx=e.clientX-(r.left+r.width/2),dy=e.clientY-(r.top+r.height/2),dist=Math.hypot(dx,dy);
    if(dist<DEAD)setDir(null);else if(Math.abs(dy)>=dist*VCOS)setDir(dy<0?'up':'down');else setDir(dx<0?'left':'right');}
  function end(e){if(e.pointerId!==id)return;id=null;setDir(null);}
  pad.addEventListener('pointerdown',e=>{e.preventDefault();audio();if(id!==null)return;id=e.pointerId;try{pad.setPointerCapture(id);}catch(_){}upd(e);});
  pad.addEventListener('pointermove',e=>{if(e.pointerId===id){e.preventDefault();upd(e);}});
  pad.addEventListener('pointerup',end);pad.addEventListener('pointercancel',end);pad.addEventListener('lostpointercapture',end);

['contextmenu','selectstart','gesturestart','dblclick'].forEach(t=>document.addEventListener(t,e=>e.preventDefault(),{passive:false}));

  freeze:v=>{frozen=v;},tick:()=>barrelTick(performance.now()),addBarrel:id=>{barrels.push({i:BPATH.indexOf(id),dodged:false});},clear:()=>{barrels=[];},
  setPlayer:id=>{player=id;},setScore:n=>{score=n;},setMisses:n=>{misses=n;},
