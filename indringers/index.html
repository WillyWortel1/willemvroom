}

/* ---------- geluid ---------- */
let actx=null,master=null,unlocked=false,silentEl=null,audioOkOnce=false,nodeCount=0;
const isIOS=/iP(hone|ad|od)/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
function silentWavURI(){ // 0,5 s stille 8-bit mono WAV, in JS gemaakt (geen extern bestand)
  const sr=8000,n=4000,b=new Uint8Array(44+n),v=new DataView(b.buffer);const w=(o,s)=>{for(let i=0;i<s.length;i++)b[o+i]=s.charCodeAt(i);};
  w(0,'RIFF');v.setUint32(4,36+n,true);w(8,'WAVE');w(12,'fmt ');v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,1,true);
  v.setUint32(24,sr,true);v.setUint32(28,sr,true);v.setUint16(32,1,true);v.setUint16(34,8,true);w(36,'data');v.setUint32(40,n,true);b.fill(128,44);
  let s='';for(let i=0;i<b.length;i++)s+=String.fromCharCode(b[i]);return 'data:audio/wav;base64,'+btoa(s);}
function audio(){ // altijd synchroon vanuit een gebruikersgebaar aanroepen
  try{
    const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;
    if(navigator.audioSession){try{if(navigator.audioSession.type!=='playback')navigator.audioSession.type='playback';}catch(e){}}
    if(!actx){actx=new AC();master=actx.createGain();master.gain.value=muted?0:0.9;master.connect(actx.destination);
      actx.onstatechange=()=>{if(actx.state==='running')audioOkOnce=true;};}
    if(actx.state!=='running'){const p=actx.resume();if(p&&p.catch)p.catch(()=>{});}
    if(!unlocked){unlocked=true;
      const b=actx.createBuffer(1,1,22050),s=actx.createBufferSource();s.buffer=b;s.connect(actx.destination);s.start(0);
      if(isIOS&&!navigator.audioSession){try{silentEl=document.createElement('audio');silentEl.src=silentWavURI();silentEl.loop=true;silentEl.setAttribute('playsinline','');silentEl.setAttribute('x-webkit-airplay','deny');silentEl.preload='auto';}catch(e){silentEl=null;}}
    }
    if(silentEl&&silentEl.paused&&!document.hidden){const p=silentEl.play();if(p&&p.catch)p.catch(()=>{});}
    if(actx.state==='running')audioOkOnce=true;
  }catch(e){}
}
['pointerdown','touchstart','touchend','mousedown','click','keydown'].forEach(t=>document.addEventListener(t,audio,{capture:true,passive:true}));
document.addEventListener('visibilitychange',()=>{if(!actx)return;
  if(document.hidden){if(silentEl)silentEl.pause();if(actx.state==='running'){const p=actx.suspend();if(p&&p.catch)p.catch(()=>{});}}
  else{const p=actx.resume();if(p&&p.catch)p.catch(()=>{});if(silentEl&&silentEl.paused){const q=silentEl.play();if(q&&q.catch)q.catch(()=>{});}}});
function canPlay(){return !muted&&actx&&master;}
function env(g,t,d,vol){vol=Math.min(.35,(vol||.05)*1.8);g.gain.setValueAtTime(0.0001,t);g.gain.linearRampToValueAtTime(vol,t+.006);g.gain.setValueAtTime(vol,t+Math.max(.01,d*.35));g.gain.exponentialRampToValueAtTime(.0001,t+d);}
function tone(f,d,type,vol,slide,delay){if(!canPlay())return;try{d=Math.max(.06,d);const t=actx.currentTime+.01+(delay||0);const o=actx.createOscillator(),g=actx.createGain();nodeCount+=2;o.type=type||'square';o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,f+slide),t+d);env(g,t,d,vol);o.connect(g);g.connect(master);o.start(t);o.stop(t+d+.05);}catch(e){}}
function noise(d,vol,delay){if(!canPlay())return;try{const t=actx.currentTime+.01+(delay||0);const n=Math.floor(actx.sampleRate*d),buf=actx.createBuffer(1,n,actx.sampleRate),a=buf.getChannelData(0);for(let i=0;i<n;i++)a[i]=(Math.random()*2-1)*(1-i/n);const s=actx.createBufferSource();s.buffer=buf;const g=actx.createGain();nodeCount+=2;g.gain.value=Math.min(.4,vol*1.6);s.connect(g);g.connect(master);s.start(t);}catch(e){}}
let siren=null;
function sirenOn(){if(siren||!canPlay())return;try{const t=actx.currentTime;const o=actx.createOscillator(),l=actx.createOscillator(),lg=actx.createGain(),g=actx.createGain();
  o.type='square';o.frequency.value=700;l.type='triangle';l.frequency.value=7;lg.gain.value=180;l.connect(lg);lg.connect(o.frequency);
  g.gain.setValueAtTime(0.0001,t);g.gain.linearRampToValueAtTime(0.045,t+.05);o.connect(g);g.connect(master);o.start(t);l.start(t);nodeCount+=4;siren={o:o,l:l,g:g};}catch(e){}}
function sirenOff(){if(!siren)return;try{const t=actx.currentTime;siren.g.gain.cancelScheduledValues(t);siren.g.gain.setValueAtTime(siren.g.gain.value,t);siren.g.gain.linearRampToValueAtTime(0.0001,t+.05);siren.o.stop(t+.08);siren.l.stop(t+.08);}catch(e){}siren=null;}
const BEAT=[147,131,117,110];
const sfx={
 beat(i){tone(BEAT[i%4],.09,'square',.11);},
 shot(){tone(1400,.12,'square',.05,-1000);},

const muteBtn=document.getElementById('mute');

function toggleMute(){muted=!muted;lsSet('indr-mute',muted?'1':'0');updMute();audio();if(master)master.gain.value=muted?0:0.9;if(muted)sirenOff();else sfx.tick();}

const keys={left:0,right:0,fire:0};const pressed={fire:false,start:false,pause:false};let fireQ=0,lastFireT=-1e9;const MAXSHOTS=6,FIRECD=80,AUTOFIRE=150;
function pressFire(){const t=performance.now();if(t-lastFireT<FIRECD)return;lastFireT=t;fireQ=Math.min(fireQ+1,MAXSHOTS);} // elke tik/druk = direct 1 schot; 80 ms tegen dubbel-tik
const KM={ArrowLeft:'left',KeyA:'left',ArrowRight:'right',KeyD:'right',Space:'fire'};
addEventListener('keydown',e=>{const k=KM[e.code];
  if(k){keys[k]=1;e.preventDefault();if(k==='fire'&&!e.repeat){pressFire();pressed.start=true;}}
  if(e.code==='ArrowUp'||e.code==='ArrowDown')e.preventDefault();
  if(e.repeat)return;
  if(e.code==='Enter'){pressed.start=true;e.preventDefault();}
  if(e.code==='KeyP'||e.code==='Escape')pressed.pause=true;
  if(e.code==='KeyM')toggleMute();
});
addEventListener('keyup',e=>{const k=KM[e.code];if(k){keys[k]=0;e.preventDefault();}});
addEventListener('blur',()=>{keys.left=keys.right=keys.fire=0;if(mode==='play')paused=true;});

document.querySelectorAll('#bF,#bP').forEach(b=>{const k=b.dataset.k;
  const down=e=>{e.preventDefault();audio();b.classList.add('on');try{b.setPointerCapture(e.pointerId);}catch(_){}
    if(k==='pause'){pressed.pause=true;return;}keys.fire=1;pressFire();pressed.start=true;};
  const up=e=>{e.preventDefault();b.classList.remove('on');if(k==='fire')keys.fire=0;};
  b.addEventListener('pointerdown',down);b.addEventListener('pointerup',up);b.addEventListener('pointercancel',up);b.addEventListener('lostpointercapture',up);});

/* arcade-joystick (alleen links/rechts) */
(function(){
  const pad=document.getElementById('stick'),ball=document.getElementById('ball'),shaft=document.getElementById('shaft'),MAXR=40,DEAD=12;
  let id=null,dir=null;
  function setDir(d){if(d===dir)return;dir=d;keys.left=d==='left'?1:0;keys.right=d==='right'?1:0;
    document.getElementById('bL').classList.toggle('on',d==='left');document.getElementById('bR').classList.toggle('on',d==='right');}
  function look(e){let x=0,y=0;if(e){const r=pad.getBoundingClientRect();x=e.clientX-(r.left+r.width/2);y=e.clientY-(r.top+r.height/2);const d=Math.hypot(x,y);if(d>MAXR){x=x/d*MAXR;y=y/d*MAXR;}}
    ball.style.transform='translate('+x.toFixed(1)+'px,'+y.toFixed(1)+'px)';shaft.style.height=Math.hypot(x,y).toFixed(1)+'px';shaft.style.transform='rotate('+(Math.atan2(y,x)*180/Math.PI-90).toFixed(1)+'deg)';}
  function upd(e){const r=pad.getBoundingClientRect(),dx=e.clientX-(r.left+r.width/2);setDir(Math.abs(dx)<DEAD?null:dx<0?'left':'right');look(e);}
  function end(e){if(e.pointerId!==id)return;id=null;setDir(null);pad.classList.add('back');look(null);}
  pad.addEventListener('pointerdown',e=>{e.preventDefault();audio();if(id!==null)return;id=e.pointerId;pad.classList.remove('back');try{pad.setPointerCapture(id);}catch(_){}upd(e);
    if(mode==='title'||mode==='over')pressed.start=true;});
  pad.addEventListener('pointermove',e=>{if(e.pointerId===id){e.preventDefault();upd(e);}});
  pad.addEventListener('pointerup',end);pad.addEventListener('pointercancel',end);pad.addEventListener('lostpointercapture',end);
  window.__stick=DEBUG?{dir:()=>dir,ball:()=>ball.getBoundingClientRect()}:undefined;
})();

/* ---------- spel ---------- */
const PY=216,GROUND=239,TOPY=28,BX=[32,78,124,170],BY=192,BW=22,BH=16;
let mode='title',paused=false,timer=0,frame=0,wave=1,score=0,lives=3,extraGiven=false,newRecord=false;
let aliens=[],ptr=0,dir=1,dropping=false,lastBeat=-99,beatIx=0,freezeA=false;
let P={x:20,alive:true,deadT:0},shots=[],bombs=[],bombT=0,bombKind=0,ufo=null,ufoT=0,shotsFired=0,fx=[],bunkers=[],ground=[],pops=[];
function alienRow(r){return r===0?'A':r<3?'B':'C';}
function pts(t){return t==='A'?30:t==='B'?20:10;}
function startY(){return 56+8*Math.min(wave-1,8);}
function makeWave(){
  aliens=[];const y0=startY();
  for(let r=4;r>=0;r--)for(let c=0;c<11;c++){const t=alienRow(r),s=SPR[t][0];aliens.push({t:t,c:c,r:r,x:24+c*16,y:y0+r*16,w:s.w,ox:Math.floor((12-s.w)/2),alive:true,f:0});}
  ptr=0;dir=1;dropping=false;bombs=[];shots=[];fireQ=0;ufo=null;sirenOff();ufoT=1200;bombT=90;fx=[];
  bunkers=BX.map(()=>{const a=new Uint8Array(BW*BH);for(let y=0;y<BH;y++)for(let x=0;x<BW;x++){let on=1;
    if(y<4&&(x<4-y||x>17+y))on=0;if(y>=12&&x>=6&&x<=15)on=0;if(y===11&&x>=7&&x<=14)on=0;if(y===10&&x>=8&&x<=13)on=0;a[y*BW+x]=on;}return a;});
  ground=new Uint8Array(W).fill(1);
}
function alive(){let n=0;for(const a of aliens)if(a.alive)n++;return n;}
function startGame(){wave=1;score=0;lives=3;extraGiven=false;newRecord=false;makeWave();P={x:20,alive:true,deadT:0};mode='intro';timer=90;sfx.start();}
function addScore(n){score+=n;if(!extraGiven&&score>=1500){extraGiven=true;lives++;sfx.extra();pops.push({x:20,y:244,t:120,s:'EXTRA LEVEN!'});}
  if(score>hiScore){hiScore=score;newRecord=true;lsSet('indr-hi',String(hiScore));}}
function bunkerAt(x,y){for(let i=0;i<4;i++){const lx=Math.floor(x)-BX[i],ly=Math.floor(y)-BY;if(lx>=0&&lx<BW&&ly>=0&&ly<BH&&bunkers[i][ly*BW+lx])return [i,lx,ly];}return null;}
function erode(b,lx,ly,up){const a=bunkers[b];for(let dy=-3;dy<=3;dy++)for(let dx=-3;dx<=3;dx++){const d=Math.abs(dx)+Math.abs(dy)*0.8;
  if(d<=1.5||(d<=4&&((dx*7+dy*13+lx*3+ly*5+frame)&3)!==0)){const x=lx+dx,y=ly+dy+(up?-1:1);if(x>=0&&x<BW&&y>=0&&y<BH)a[y*BW+x]=0;}}sfx.bunker();}
function bunkerCount(i){let n=0;for(const v of bunkers[i])n+=v;return n;}

function stepFormation(){
  const n=alive();if(!n)return;
  const per=1+(wave>=4?1:0);
  for(let k=0;k<per;k++){
    let guard=0;while(!aliens[ptr].alive&&guard++<60){ptr++;if(ptr>=aliens.length)sweepEnd();}
    const a=aliens[ptr];
    if(dropping)a.y+=8;else a.x+=dir*(n===1&&dir>0?3:2);
    a.f^=1;ptr++;if(ptr>=aliens.length)sweepEnd();
  }
}
function sweepEnd(){
  ptr=0;
  if(dropping){dropping=false;dir=-dir;}
  else{let mn=999,mx=-999;for(const a of aliens)if(a.alive){mn=Math.min(mn,a.x+a.ox);mx=Math.max(mx,a.x+a.ox+a.w);}
    if((dir>0&&mx>=W-10)||(dir<0&&mn<=10))dropping=true;}
  if(frame-lastBeat>=5){sfx.beat(beatIx++);lastBeat=frame;}
}
function fireBomb(){
  const maxB=Math.min(5,3+Math.floor((wave-1)/2));if(bombs.length>=maxB)return;
  const kinds=['golf','zig','kruis'],kind=kinds[bombKind++%3];
  const cols={};for(const a of aliens)if(a.alive){if(!cols[a.c]||a.r>cols[a.c].r)cols[a.c]=a;}
  const list=Object.values(cols);if(!list.length)return;
  let src;
  if(kind==='golf'){let best=null,bd=1e9;for(const a of list){const d=Math.abs(a.x+a.ox+a.w/2-(P.x+6));if(d<bd){bd=d;best=a;}}src=best;}
  else src=list[Math.floor(Math.random()*list.length)];
  bombs.push({x:src.x+src.ox+Math.floor(src.w/2),y:src.y+8,kind:kind,f:0,acc:0});
}
function bombSpeed(){return alive()<=8?1.8:1.25+0.05*Math.min(wave-1,5);}
function bombReload(){return Math.max(18,64-wave*5-(score>3000?10:0));}
function killPlayer(){if(!P.alive)return;P.alive=false;P.deadT=0;sfx.die();sirenOff();lives--;}
function update(){
  frame++;
  if(pressed.pause&&mode==='play')paused=!paused;else if(pressed.pause&&paused)paused=false;
  if(paused){sirenOff();clear();return;}
  for(const p of pops)p.t--;pops=pops.filter(p=>p.t>0);
  for(const e of fx)e.t--;fx=fx.filter(e=>e.t>0);
  if(mode==='title'){if(pressed.start)startGame();}
  else if(mode==='intro'){if(--timer<=0)mode='play';}
  else if(mode==='play')updatePlay();
  else if(mode==='clear'){if(--timer<=0){wave++;makeWave();P.x=20;mode='intro';timer=90;sfx.wave();}}
  else if(mode==='over'){timer++;if(timer>90&&pressed.start)mode='title';}
  clear();
}
function clear(){if(mode!=='play')fireQ=0;pressed.fire=pressed.start=pressed.pause=false;}
function updatePlay(){
  if(!P.alive){P.deadT++;if(P.deadT>=120){if(lives<=0){mode='over';timer=0;sfx.over();}else{P.alive=true;P.x=20;bombs=[];}}return;}
  if(keys.left)P.x=Math.max(8,P.x-1);if(keys.right)P.x=Math.min(W-21,P.x+1);
  if(keys.fire&&performance.now()-lastFireT>=AUTOFIRE){lastFireT=performance.now();fireQ=Math.min(fireQ+1,MAXSHOTS);} // vasthouden = autovuur elke 150 ms
  if(fireQ>0){fireQ--;if(shots.length<MAXSHOTS){shots.push({x:P.x+6,y:PY-4});shotsFired++;sfx.shot();}}
  if(!freezeA)stepFormation();
  // invasie
  for(const a of aliens)if(a.alive){if(a.y+8>=PY){P.alive=false;P.deadT=0;lives=0;sfx.die();sirenOff();return;}
    for(let i=0;i<4;i++){const lx0=a.x+a.ox-BX[i],ly0=a.y-BY;for(let y=Math.max(0,ly0);y<Math.min(BH,ly0+8);y++)for(let x=Math.max(0,lx0);x<Math.min(BW,lx0+a.w);x++)bunkers[i][y*BW+x]=0;}}
  // schot
  for(let si=shots.length-1;si>=0;si--){let shot=shots[si];for(let s=0;s<4&&shot;s++){shot.y--;
    const b=bunkerAt(shot.x,shot.y);if(b){erode(b[0],b[1],b[2],true);fx.push({x:shot.x-3,y:shot.y-3,t:10,s:'spark'});shot=null;break;}
    for(const a of aliens)if(a.alive&&shot.x>=a.x+a.ox&&shot.x<a.x+a.ox+a.w&&shot.y>=a.y&&shot.y<a.y+8){a.alive=false;addScore(pts(a.t));fx.push({x:a.x,y:a.y,t:16,s:'boom'});sfx.hit();shot=null;break;}
    if(!shot)break;
    for(let i=bombs.length-1;i>=0;i--){const bb=bombs[i];if(Math.abs(bb.x-shot.x)<=2&&shot.y>=bb.y&&shot.y<bb.y+7){fx.push({x:bb.x-3,y:bb.y,t:10,s:'spark'});bombs.splice(i,1);shot=null;break;}}
    if(!shot)break;
    if(ufo&&shot.x>=ufo.x&&shot.x<ufo.x+16&&shot.y>=40&&shot.y<46){const v=[50,100,150,300][Math.floor(Math.random()*4)];addScore(v);pops.push({x:ufo.x+8,y:40,t:70,s:String(v)});sfx.ufoHit();sirenOff();ufo=null;shot=null;break;}
    if(shot.y<=TOPY){fx.push({x:shot.x-3,y:TOPY,t:10,s:'spark'});shot=null;}
  }if(!shot)shots.splice(si,1);}
  // bommen
  if(--bombT<=0){bombT=bombReload();fireBomb();}
  const v=bombSpeed();
  for(let i=bombs.length-1;i>=0;i--){const b=bombs[i];b.acc+=v;if(frame%5===0)b.f=(b.f+1)%3;let gone=false;
    while(b.acc>=1&&!gone){b.acc--;b.y++;const by=b.y+7;
      const hb=bunkerAt(b.x,by);if(hb){erode(hb[0],hb[1],hb[2],false);gone=true;break;}
      if(by>=PY+1&&by<=PY+8&&b.x>=P.x&&b.x<P.x+13){killPlayer();gone=true;break;}
      if(by>=GROUND){if(b.x>=0&&b.x<W){for(let d=-1;d<=1;d++)if(b.x+d>=0&&b.x+d<W)ground[b.x+d]=0;}fx.push({x:b.x-3,y:GROUND-6,t:10,s:'spark'});gone=true;break;}}
    if(gone)bombs.splice(i,1);}
  // ufo
  if(ufo){ufo.x+=ufo.d*0.8;if(ufo.x<-18||ufo.x>W+2){ufo=null;sirenOff();}}
  else if(--ufoT<=0){ufoT=1400;if(alive()>=8){spawnUfo();}}
  if(!alive()){mode='clear';timer=90;sirenOff();}
}
function spawnUfo(){const d=shotsFired%2?1:-1;ufo={x:d>0?-16:W,d:d};sirenOn();}

/* ---------- tekenen ---------- */
function drawWorld(){
  ctx.globalCompositeOperation='source-over';ctx.fillStyle='#000';ctx.fillRect(0,0,W,H);
  text('SCORE',8,3,'#fff');text(String(score).padStart(5,'0'),8,13,'#fff');
  text('GOLF '+wave,W/2,3,'#fff',1,'center');
  text('HOOG',W-8,3,'#fff',1,'right');text(String(hiScore).padStart(5,'0'),W-8,13,'#fff',1,'right');
  for(const a of aliens)if(a.alive)spr(SPR[a.t][a.f],a.x+a.ox,a.y);
  if(ufo)spr(SPR.ufo,ufo.x,40);
  ctx.fillStyle='#fff';
  for(let i=0;i<4;i++){const a=bunkers[i];for(let y=0;y<BH;y++)for(let x=0;x<BW;x++)if(a[y*BW+x])ctx.fillRect(BX[i]+x,BY+y,1,1);}
  for(let x=0;x<W;x++)if(ground[x])ctx.fillRect(x,GROUND,1,1);
  if(mode!=='title'){
    if(P.alive)spr(SPR.player,P.x,PY);else if(P.deadT<100)spr(SPR.pdie[Math.floor(P.deadT/6)%2],P.x,PY);
  }
  ctx.fillStyle='#fff';for(const sh of shots)ctx.fillRect(sh.x,sh.y,1,4);
  for(const b of bombs)spr(BOMBS[b.kind][b.f],b.x-1,b.y);
  for(const e of fx)spr(SPR[e.s],e.x,e.y);
  for(const p of pops)text(p.s,p.x,p.y,'#fff',1,'center');
  text(String(Math.max(0,lives)),8,245,'#fff');for(let i=0;i<Math.min(lives-1,5);i++)spr(SPR.life,20+i*10,247);
  if(DEBUG&&!/nolabel/.test(location.search))text('DEBUG',W-8,245,'#fff',1,'right');
}
function tint(){ // kleurfolie zoals op de oude kast
  ctx.globalCompositeOperation='multiply';
  ctx.fillStyle='#ff4f7b';ctx.fillRect(0,TOPY,W,20);
  ctx.fillStyle='#38ff5a';ctx.fillRect(0,184,W,H-184);
  ctx.globalCompositeOperation='source-over';
}
function box(lines,y){const h=lines.length*12+10;ctx.fillStyle='rgba(0,0,0,.85)';ctx.fillRect(20,y,W-40,h);ctx.fillStyle='#38ff5a';ctx.fillRect(20,y,W-40,1);ctx.fillRect(20,y+h-1,W-40,1);
  lines.forEach((l,i)=>text(l[0],W/2,y+6+i*12,l[1]||'#fff',1,'center'));}
function drawTitle(){
  ctx.globalCompositeOperation='source-over';ctx.fillStyle='#000';ctx.fillRect(0,0,W,H);
  text('SCORE',8,3);text(String(score).padStart(5,'0'),8,13);text('HOOG',W-8,3,'#fff',1,'right');text(String(hiScore).padStart(5,'0'),W-8,13,'#fff',1,'right');
  text('INDRINGERS!',W/2+1,41,'#3a0f1a',2,'center');text('INDRINGERS!',W/2,40,'#ff4f7b',2,'center');
  text('VERDEDIG DE AARDE!',W/2,62,'#fff',1,'center');
  text('*PUNTENTABEL*',W/2,86,'#fff',1,'center');
  const f=Math.floor(frame/30)%2;
  spr(SPR.ufo,60,103);text('= ? MYSTERIE',82,103,'#ff4f7b');
  spr(SPR.A[f],64,121);text('= 30 PUNTEN',82,121);
  spr(SPR.B[f],62,139);text('= 20 PUNTEN',82,139);
  spr(SPR.C[f],62,157);text('= 10 PUNTEN',82,157,'#fff');
  if(Math.floor(frame/30)%2===0)text(isTouch?'TIK OM TE STARTEN':'DRUK OP SPATIE OM TE STARTEN',W/2,184,'#38ff5a',1,'center');
  if(isTouch&&!muted&&!audioOkOnce&&!(actx&&actx.state==='running')&&Math.floor(frame/20)%3!==0)text('TIK VOOR GELUID',W/2,200,'#ffd23f',1,'center');
  text('PIJLTJES/AD: BEWEGEN  SPATIE: VUUR',W/2,224,'#8a8f9c',1,'center');
  text('P: PAUZE   M: GELUID',W/2,236,'#8a8f9c',1,'center');
}
function render(){
  if(mode==='title'){drawTitle();return;}
  drawWorld();tint();
  if(mode==='intro')box([['GOLF '+wave,'#ffd23f'],[wave===1?'VERDEDIG DE AARDE!':'ZE KOMEN DICHTERBIJ!']],100);
  if(mode==='clear')box([['GOLF '+wave+' VERSLAGEN!','#38ff5a']],108);
  if(mode==='over'){const l=[['SPEL VOORBIJ','#ff4f7b'],['SCORE '+score]];if(newRecord)l.push(['NIEUW RECORD!','#ffd23f']);if(timer>90&&Math.floor(frame/30)%2===0)l.push([isTouch?'TIK OM DOOR TE GAAN':'DRUK OP SPATIE','#38ff5a']);box(l,96);}
  if(paused)box([['PAUZE','#ffd23f'],[isTouch?'TIK II OM DOOR TE GAAN':'DRUK OP P OM DOOR TE GAAN']],104);
}
let last=performance.now(),acc=0;const STEP=1000/60;
function tick(now){acc+=Math.min(250,now-last);last=now;let n=0;while(acc>=STEP&&n<5){update();acc-=STEP;n++;}if(n>=5)acc=0;render();requestAnimationFrame(tick);}
makeWave();
if(DEBUG)window.__inv={state:()=>({mode:mode,paused:paused,wave:wave,score:score,lives:lives,px:P.x,palive:P.alive,shot:shots.length>0,shots:shots.length,fired:shotsFired,bombs:bombs.length,ufo:ufo?ufo.x:null,alive:alive(),
   topY:Math.min(...aliens.filter(a=>a.alive).map(a=>a.y).concat([999])),bunkers:[0,1,2,3].map(bunkerCount),hi:hiScore,muted:muted}),
  aliens:()=>aliens.filter(a=>a.alive).map(a=>({x:a.x+a.ox,w:a.w,y:a.y,t:a.t})),freeze:v=>{freezeA=v;},setX:x=>{P.x=x;},killAll:()=>{aliens.forEach(a=>a.alive=false);},clearColumn:x=>{aliens.forEach(a=>{if(x>=a.x+a.ox-2&&x<a.x+a.ox+a.w+2)a.alive=false;});},
  killAllBut:n=>{let k=0;aliens.forEach(a=>{if(a.alive&&k++>=n)a.alive=false;});},bomb:(x,y,kind)=>bombs.push({x:x,y:y,kind:kind||'zig',f:0,acc:0}),noBombs:()=>{bombT=1e9;bombs=[];},
  spawnUfo:()=>spawnUfo(),setLives:n=>{lives=n;},lowerAll:dy=>{aliens.forEach(a=>a.y+=dy);},
  audio:()=>({state:actx?actx.state:'none',muted:muted,gain:master?master.gain.value:null,nodes:nodeCount}),sfxAll:()=>{const n0=nodeCount;for(const k in sfx)sfx[k](0);return nodeCount-n0;}};
resize();requestAnimationFrame(tick);
})();
</script>
