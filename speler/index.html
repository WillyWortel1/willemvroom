<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="robots" content="noindex,nofollow">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'sha256-ab+x5CbENoufavQrRoxVtUj1k8/RMe/MHlFbzwQznRw=' https://www.youtube.com https://s.ytimg.com; frame-src https://www.youtube-nocookie.com https://www.youtube.com; connect-src https://sponsor.ajay.app; img-src data: https://i.ytimg.com; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'">
<link rel="icon" href="data:,">
<title>Speler</title>
<style>
:root{--f:"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
*{box-sizing:border-box}
html,body{margin:0;background:#fff;color:#111;font:16px/1.5 var(--f)}
main{max-width:860px;margin:0 auto;padding:max(24px,env(safe-area-inset-top)) 18px 40px}
h1{font-size:22px;font-weight:600;margin:0 0 18px;letter-spacing:-.01em}
form{display:flex;gap:8px}
input[type=url],input[type=text]{flex:1;min-width:0;font:inherit;padding:11px 12px;border:1px solid #111;border-radius:0;background:#fff;color:#111}
button{font:inherit;font-weight:600;padding:10px 16px;border:1px solid #111;background:#111;color:#fff;cursor:pointer;border-radius:0}
button.l{background:#fff;color:#111}
button:focus-visible,input:focus-visible{outline:2px solid #111;outline-offset:2px}
.cats{display:flex;flex-wrap:wrap;gap:6px 14px;margin:14px 0 0;font-size:14px;color:#444}
.cats label{display:inline-flex;align-items:center;gap:5px;cursor:pointer}
.err{color:#b00;font-size:14px;min-height:21px;margin:8px 0 0}
#stage{display:none;margin-top:18px}
#stage.on{display:block}
.frame{position:relative;width:100%;aspect-ratio:16/9;background:#000}
.frame>*{position:absolute;inset:0;width:100%;height:100%;border:0}
.bar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:10px 0}
#info{font-size:14px;color:#444}
#segs{list-style:none;margin:0;padding:0;font-size:14px;border-top:1px solid #ddd}
#segs li{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid #eee}
#segs li.off{color:#999;text-decoration:line-through}
#toast{position:fixed;left:50%;bottom:max(20px,env(safe-area-inset-bottom));transform:translateX(-50%);background:#111;color:#fff;padding:10px 12px 10px 16px;display:none;align-items:center;gap:14px;font-size:14px;max-width:calc(100% - 24px)}
#toast.on{display:flex}
#toast button{background:#fff;color:#111;padding:5px 10px;font-size:13px}
footer{margin-top:28px;font-size:12px;color:#777}
@media(max-width:520px){form{flex-direction:column}main{padding-left:12px;padding-right:12px}}
</style>
</head>
<body>
<main>
<h1>Speler</h1>
<form id="f" autocomplete="off">
  <input id="u" type="text" inputmode="url" placeholder="Plak een YouTube-link" aria-label="Plak een YouTube-link" spellcheck="false">
  <button id="go" type="submit">Afspelen</button>
</form>
<div class="cats" id="cats"></div>
<div class="err" id="err" role="status"></div>
<section id="stage" aria-live="polite">
  <div class="frame"><div id="ph"></div></div>
  <div class="bar"><span id="info"></span><button id="close" class="l" type="button">Sluiten</button></div>
  <ul id="segs"></ul>
</section>
<footer>Officiële YouTube-speler (youtube-nocookie). Sponsorstukjes via SponsorBlock. Deze pagina bewaart niets.</footer>
</main>
<div id="toast" role="status"><span id="tmsg"></span><button id="undo" type="button">Ongedaan</button></div>
<script>
(function(){
'use strict';
const CATS={sponsor:'Sponsor',selfpromo:'Eigen promotie',interaction:'Abonneer-oproep',intro:'Intro',outro:'Outro',preview:'Voorvertoning',music_offtopic:'Niet-muziek'};
const NAME1={sponsor:'Sponsor',selfpromo:'Eigen promotie',interaction:'Oproep',intro:'Intro',outro:'Outro',preview:'Voorvertoning',music_offtopic:'Niet-muziek'};
const SB='https://sponsor.ajay.app/api/skipSegments';
const $=id=>document.getElementById(id);
const qs=new URLSearchParams(location.search);
// instellingen alleen in geheugen/URL (geen opslag)
let cats=new Set((qs.get('c')||'sponsor,selfpromo,interaction').split(',').filter(c=>CATS[c]));
let privacy=qs.get('hash')!=='0';
let player=null,poll=null,toastT=null,segs=[],lastSkip=null,vidId=null,session=0;

function renderCats(){const box=$('cats');box.textContent='';
  for(const k in CATS){const l=document.createElement('label'),c=document.createElement('input');c.type='checkbox';c.checked=cats.has(k);
    c.addEventListener('change',()=>{c.checked?cats.add(k):cats.delete(k);syncURL();if(vidId)loadSegments(vidId,session);});l.append(c,CATS[k]);box.append(l);}
  const l=document.createElement('label'),c=document.createElement('input');c.type='checkbox';c.checked=privacy;c.title='Vraag alleen de eerste 4 tekens van de SHA-256-hash op';
  c.addEventListener('change',()=>{privacy=c.checked;syncURL();});l.append(c,'Privé-opvraag');box.append(l);}
function syncURL(){const p=new URLSearchParams();if(vidId)p.set('v',vidId);const c=[...cats].join(',');if(c!=='sponsor,selfpromo,interaction')p.set('c',c);if(!privacy)p.set('hash','0');
  const s=p.toString();history.replaceState(null,'',location.pathname+(s?'?'+s:''));}

function parseTime(t){if(!t)return 0;if(/^\d+$/.test(t))return +t;const m=/^(?:(\d+)h)?(?:(\d+)m)?(?:(\d+)s)?$/.exec(t);return m?(+(m[1]||0))*3600+(+(m[2]||0))*60+(+(m[3]||0)):0;}
function parseInput(s){s=(s||'').trim();if(/^[\w-]{11}$/.test(s))return {id:s,t:0};
  let u;try{u=new URL(/^https?:\/\//i.test(s)?s:'https://'+s);}catch(e){return null;}
  const h=u.hostname.replace(/^(www|m|music)\./,'');let id=null;
  if(h==='youtu.be')id=u.pathname.slice(1).split('/')[0];
  else if(h==='youtube.com'||h==='youtube-nocookie.com'){if(u.pathname==='/watch')id=u.searchParams.get('v');else{const m=/^\/(shorts|embed|live|v)\/([\w-]{11})/.exec(u.pathname);if(m)id=m[2];}}
  if(!id||!/^[\w-]{11}$/.test(id))return null;
  return {id:id,t:parseTime(u.searchParams.get('t')||u.searchParams.get('start')||(u.hash.match(/t=([\dhms]+)/)||[])[1])};}
function fmt(s){s=Math.max(0,Math.floor(s));const h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=String(s%60).padStart(2,'0');return h?h+':'+String(m).padStart(2,'0')+':'+x:m+':'+x;}

async function sha256hex(s){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('');}
async function fetchSegments(id){
  const c=encodeURIComponent(JSON.stringify([...cats])),a=encodeURIComponent('["skip"]');
  let url;if(privacy){const h=(await sha256hex(id)).slice(0,4);url=SB+'/'+h+'?categories='+c+'&actionTypes='+a;}else url=SB+'?videoID='+id+'&categories='+c+'&actionTypes='+a;
  const r=await fetch(url,{credentials:'omit',cache:'no-store',referrerPolicy:'no-referrer'});
  if(r.status===404)return [];if(!r.ok)throw new Error('HTTP '+r.status);
  const d=await r.json();const list=privacy?((d.find(v=>v.videoID===id)||{}).segments||[]):d;
  return list.filter(s=>s&&Array.isArray(s.segment)&&(s.actionType||'skip')==='skip'&&cats.has(s.category)&&s.segment[1]>s.segment[0])
    .map(s=>({start:+s.segment[0],end:+s.segment[1],cat:s.category,ignored:false,inside:false})).sort((a,b)=>a.start-b.start);}
async function loadSegments(id,ses){$('info').textContent='Stukjes zoeken…';
  try{const s=await fetchSegments(id);if(ses!==session)return;segs=s;}catch(e){if(ses!==session)return;segs=[];$('info').textContent='SponsorBlock niet bereikbaar – video speelt gewoon af';renderSegs(true);return;}
  renderSegs();}
function renderSegs(keepInfo){const ul=$('segs');ul.textContent='';
  if(!keepInfo)$('info').textContent=segs.length?(segs.length===1?'1 stukje wordt overgeslagen':segs.length+' stukjes worden overgeslagen'):'Geen stukjes om over te slaan';
  for(const s of segs){const li=document.createElement('li');if(s.ignored)li.className='off';const a=document.createElement('span'),b=document.createElement('span');a.textContent=NAME1[s.cat];b.textContent=fmt(s.start)+' – '+fmt(s.end);li.append(a,b);ul.append(li);}}

function toast(msg){$('tmsg').textContent=msg;$('toast').classList.add('on');clearTimeout(toastT);toastT=setTimeout(hideToast,5000);}
function hideToast(){$('toast').classList.remove('on');clearTimeout(toastT);toastT=null;}
$('undo').addEventListener('click',()=>{if(lastSkip&&player){lastSkip.ignored=true;try{player.seekTo(lastSkip.start,true);}catch(e){}renderSegs();}lastSkip=null;hideToast();});

function tick(){if(!player||typeof player.getCurrentTime!=='function')return;let t;try{t=player.getCurrentTime();}catch(e){return;}
  for(const s of segs){const inside=t>=s.start&&t<s.end-0.25;
    if(inside&&!s.inside&&!s.ignored){ // elke keer dat de tijd het stukje binnenkomt: één keer overslaan
      s.inside=true;try{player.seekTo(s.end,true);}catch(e){}lastSkip=s;toast(NAME1[s.cat]+' overgeslagen ('+fmt(s.start)+')');}
    else if(!inside)s.inside=false;}}

let apiP=null;
function loadAPI(){if(window.YT&&window.YT.Player)return Promise.resolve();if(apiP)return apiP;
  apiP=new Promise((res,rej)=>{const prev=window.onYouTubeIframeAPIReady;window.onYouTubeIframeAPIReady=()=>{if(prev)try{prev();}catch(e){}res();};
    const s=document.createElement('script');s.src='https://www.youtube.com/iframe_api';s.referrerPolicy='strict-origin-when-cross-origin';s.onerror=()=>{apiP=null;s.remove();rej(new Error('api'));};document.head.append(s);});
  return apiP;}

async function play(p){close(true);session++;const ses=session;vidId=p.id;syncURL();$('err').textContent='';$('stage').classList.add('on');
  loadSegments(p.id,ses);
  try{await loadAPI();}catch(e){if(ses===session){$('err').textContent='YouTube-speler kon niet laden.';close();}return;}
  if(ses!==session)return;
  const el=document.createElement('div');$('ph').replaceWith(el);el.id='ph';
  player=new YT.Player('ph',{host:'https://www.youtube-nocookie.com',videoId:p.id,width:'100%',height:'100%',
    playerVars:{start:Math.floor(p.t)||0,playsinline:1,rel:0,modestbranding:1,autoplay:1,origin:location.origin},
    events:{onReady:e=>{try{e.target.playVideo();}catch(_){}},onStateChange:e=>{if(e.data===0)close();},onError:()=>{$('err').textContent='Deze video kan niet worden afgespeeld.';}}});
  poll=setInterval(tick,250);}

function close(silent){session++;
  if(poll){clearInterval(poll);poll=null;}hideToast();
  if(player){try{player.destroy();}catch(e){}player=null;}
  const frame=document.querySelector('.frame');frame.querySelectorAll('iframe').forEach(f=>{f.src='about:blank';f.remove();});
  frame.textContent='';const ph=document.createElement('div');ph.id='ph';frame.append(ph);
  segs=[];lastSkip=null;vidId=null;$('segs').textContent='';$('info').textContent='';$('stage').classList.remove('on');
  if(!silent){$('u').value='';syncURL();}}
$('close').addEventListener('click',()=>close());
$('f').addEventListener('submit',e=>{e.preventDefault();const p=parseInput($('u').value);if(!p){$('err').textContent='Dat lijkt geen YouTube-link.';return;}play(p);});
renderCats();
const v0=qs.get('v');if(v0){const p=parseInput(v0)||null;if(p){p.t=parseTime(qs.get('t'))||p.t;$('u').value='https://youtu.be/'+p.id;play(p);}}
if(window.__SPELER_TEST)window.__speler={parseInput:parseInput,parseTime:parseTime,state:()=>({player:!!player,poll:!!poll,segs:segs.map(s=>({...s})),vid:vidId,info:$('info').textContent,toast:$('toast').classList.contains('on')?$('tmsg').textContent:null})};
})();
</script>
</body>
</html>
