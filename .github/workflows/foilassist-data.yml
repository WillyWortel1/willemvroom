name: Foilassist data
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
  push:
    paths: ["foilassist/spots.js"]
permissions:
  contents: write
concurrency: foilassist-data
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: python3 -u foilassist/tools/fetch_data.py
      - run: |
          git config user.name WillyWortel1
          git config user.email WillyWortel1@users.noreply.github.com
          git add foilassist/data.json
          if git diff --cached --quiet; then
            echo "geen datawijziging"
            exit 0
          fi
          git commit -m "Foilassist data update"
          for i in 1 2 3 4 5; do
            git pull --rebase -X theirs || git rebase --abort || true
            if git push; then
              echo "push ok (poging $i)"
              exit 0
            fi
            echo "push mislukt (poging $i), wacht ${i}0s"
            sleep $((i * 10))
          done
          echo "push mislukt na 5 pogingen"
          exit 1
