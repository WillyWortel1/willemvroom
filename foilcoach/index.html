<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="description" content="Analyseer je eigen foilvideo. Lokale houdingsherkenning, vier meetmomenten en een heldere 2D-vergelijking."><title>Prone foil — Videoanalyse</title><link rel="icon" href="/favicon.svg"><link rel="stylesheet" href="./style.css"></head><body>
<header><a class="brand" href="./"><span class="mark" aria-hidden="true"></span>Prone foil</a><nav><a class="home" href="/" data-copy="home"></a><a id="language" href="https://willemvroom.com/foilcoach/" lang="en">EN ↗</a><button id="theme" data-copy="theme"></button><button id="size" data-copy="size"></button></nav></header>
<main class="wrap"><section class="intro"><div><p class="eyebrow" data-copy="eyebrow"></p><h1 data-copy="headline"></h1><p data-copy="intro"></p></div><span class="local" data-copy="local"></span></section>
<div class="workspace"><div class="stage-wrap"><div class="stage" id="stage"><video id="video" playsinline preload="metadata" hidden></video><canvas id="overlay"></canvas><div id="empty" class="empty"><div class="upload-icon" aria-hidden="true">↑</div><h2 data-copy="uploadTitle"></h2><p data-copy="uploadHelp"></p><label class="upload"><span data-copy="choose"></span><input id="upload" type="file" accept="video/*,.mp4,.mov,.webm" aria-label="Video"></label></div><span class="stage-label" data-copy="stage"></span></div>
<div class="file-row" id="fileRow" hidden><span id="fileName"></span><label><span class="small" data-copy="replace"></span><input id="replacement" type="file" accept="video/*,.mp4,.mov,.webm" aria-label="Video"></label></div>
<div class="controls"><button id="play" disabled data-copy="play"></button><label><span data-copy="speed"></span><select id="speed"><option value="0.25">0.25×</option><option value="0.5">0.5×</option><option value="1" selected>1×</option></select></label><span class="spacer"></span><label><input id="skeleton" type="checkbox" checked><span data-copy="overlay"></span></label></div>
<div class="roi-tools"><button id="selectRider" disabled></button><button id="fullFrame" disabled></button><span id="roiStatus" class="roi-status"></span></div><details class="roi-exact"><summary id="roiBoundsTitle"></summary><div class="roi-fields" id="roiFields"></div><button id="applyROI" disabled></button><p id="roiHelp" class="small"></p></details><div class="scrub"><span id="time">0:00.00</span><input type="range" id="scrub" min="0" max="1" step="0.01" value="0" disabled aria-label="Video timeline"><span id="duration">0:00</span></div>
</div><aside class="panel"><p class="eyebrow" data-copy="setup"></p><label class="field"><span data-copy="discipline"></span><select id="discipline"></select></label><label class="field"><span data-copy="goal"></span><select id="goal"></select></label><label class="field"><span data-copy="camera"></span><select id="camera"><option value="other" data-copy="other"></option><option value="side" data-copy="side"></option></select><small data-copy="cameraHelp"></small></label><label class="check"><input type="checkbox" id="assisted"><span data-copy="assisted"></span></label><div class="range"><label class="field"><span data-copy="start"></span><input id="from" type="number" min="0" value="0" step="0.1" disabled></label><label class="field"><span data-copy="end"></span><input id="to" type="number" min="1" value="10" step="0.1" disabled></label></div><p class="small" data-copy="rangeHelp"></p><button id="analyse" class="primary" disabled data-copy="analyse"></button><p class="status" id="status" role="status" aria-live="polite" data-copy="ready"></p><progress id="progress" max="1" value="0" hidden aria-label="Analysis progress"></progress><button id="cancel" hidden data-copy="cancel"></button><p class="note" data-copy="privacy"></p></aside></div>
<section><div class="section-head"><div><p class="eyebrow">02 / <span data-copy="sampling"></span></p><h2 data-copy="checkpoints"></h2><p data-copy="checkpointHelp"></p></div><button id="export" disabled data-copy="export"></button></div><div id="checkpoints" class="checkpoints"></div><p id="pointHelp" class="small" data-copy="emptyPoints"></p><p class="baseline-note" data-copy="baseline"></p></section>
<section id="resultsSection" hidden><div class="section-head"><h2 data-copy="results"></h2><span class="pill" id="coveragePill"></span></div><div id="results" class="results"></div></section>
<section id="review" class="review-section"></section><section id="library" class="source-library"></section><section class="help"><details><summary data-copy="help"></summary><div class="help-grid"><div><p data-copy="help1"></p><p data-copy="help2"></p><p data-copy="manual"></p></div><div><h3 data-copy="sources"></h3><p data-copy="method"></p><p><a href="https://ai.google.dev/edge/mediapipe/solutions/vision/pose_landmarker/web_js" target="_blank" rel="noopener">MediaPipe · Pose Landmarker</a></p><p><a href="https://caseyaus.com/courses/surf-foil/" target="_blank" rel="noopener">Coach Casey · Surf foil</a></p><p><a href="https://www.akdurablesupplyco.com/news/pump-foiling-101/" target="_blank" rel="noopener">AK · Pump foiling</a></p></div></div></details></section><footer><a href="/">willemvroom.nl</a><span data-copy="footer"></span></footer></main><noscript>Prone foil requires JavaScript / heeft JavaScript nodig.</noscript><script type="module" src="./app.mjs"></script></body></html>
