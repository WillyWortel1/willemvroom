<!DOCTYPE html>
<html lang="nl" class="antialiased">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TV</title>
<meta name="description" content="Kijk gratis tv-zenders van over de hele wereld, op een moderne tv.">
<link rel="canonical" href="https://willemvroom.nl/tv/">
<meta name="theme-color" content="#ffffff">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="stylesheet" href="/styles.css?v=20261018"><link rel="stylesheet" href="/site.css?v=20261021-sf">
<script>(function(){try{var t=localStorage.getItem("wv-theme");if(t==="dark"||(!t&&matchMedia("(prefers-color-scheme: dark)").matches)){document.documentElement.classList.add("dark");var m=document.querySelector('meta[name="theme-color"]');if(m)m.setAttribute("content","#0b0b0b");}}catch(e){}})();</script>
<link rel="stylesheet" href="/tv/tv.css?v=20261022-2">
</head>
<body>
<div id="top" class="bg-bg text-fg">
<header class="wv-head"><a href="/" class="home">willemvroom.nl</a><nav><button id="thm" type="button" aria-label=""><svg class="moon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg><svg class="sun" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button></nav></header>
<main id="inhoud" class="landing"><section class="mx-auto max-w-6xl px-5 pt-12 pb-8 sm:px-8 sm:pt-16">
<h1 class="font-display text-3xl leading-tight font-medium tracking-tight">TV</h1>
<p class="mt-3 max-w-xl text-base text-muted">Gratis tv-zenders van over de hele wereld.</p>
<div class="tv-wrap"><div class="tv" id="tv">
<div class="tv-screen" id="scr"><video id="vid" playsinline muted autoplay></video>
<div class="nosig" id="nosig" hidden><canvas id="noise" width="160" height="90"></canvas><div class="bars"></div><div class="nosig-t"><b>Geen signaal</b><span id="nosigmsg">Deze zender is nu niet te ontvangen.</span><span><button id="skipbtn" type="button">Volgende zender</button> <label><input type="checkbox" id="autoskip" checked> automatisch</label></span></div></div>
<div class="osd" id="osd" hidden><span class="osd-n" id="osdn"></span><span class="osd-name" id="osdname"></span></div>
<div class="tv-load" id="load">Zenders laden…</div>
<div class="mini" id="mini"><button type="button" id="mdn" aria-label="Vorige zender">▼</button><button type="button" id="mup" aria-label="Volgende zender">▲</button><button type="button" id="mmute" aria-label="Geluid aan/uit">🔇</button></div>
<button class="unmute" id="unmute" type="button" hidden>🔊 Tik voor geluid</button>
</div></div><div class="tv-stand"><i></i></div></div>
<div class="remote">
<div class="rbtns">
<button type="button" id="chdn" aria-label="Vorige zender">▼</button><button type="button" id="chup" aria-label="Volgende zender">▲</button>
<button type="button" id="mute" aria-label="Geluid aan/uit">🔇</button>
<input type="range" id="vol" min="0" max="1" step="0.05" value="0.8" aria-label="Volume">
<button type="button" id="fs" aria-label="Volledig scherm">⛶</button>
</div>
<div class="rfilters">
<select id="country" aria-label="Land"></select>
<select id="cat" aria-label="Categorie"><option value="">Alle categorieën</option></select>
<input type="search" id="q" placeholder="Zoek zender" aria-label="Zoek zender">
</div>
<p class="rcount text-sm text-subtle" id="count"></p>
<ol class="chlist" id="list"></ol>
</div>
<p class="mt-4 max-w-xl text-sm text-subtle">Zenders uit de open lijst van <a class="link-line" href="https://github.com/iptv-org/iptv" rel="noopener">iptv-org</a>. Niet elke zender is altijd of overal te ontvangen.</p>
</section>
</main>
<footer class="border-t border-line"><div class="mx-auto flex max-w-6xl flex-col items-center gap-2 px-5 py-8 text-center text-sm text-subtle sm:px-8"><p>willemvroom.nl</p><p>© 2026</p></div></footer>
</div>
<script src="/site.js?v=20261020-n2"></script>
<script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.20/dist/hls.min.js"></script>
<script src="/tv/tv.js?v=20261022-2"></script>
</body>
</html>
