  pockets:(step,secs,ylo)=>{noNudge=true;const out=[];let n=0;const sv=[mode,launched];balls=[ball];
    for(const up of [false,true])for(let y=(ylo||0)+1.37;y<560;y+=step)for(let x=11.71;x<289;x+=step){
      if(y<140&&Math.hypot(x-AC.x,y-AC.y)>AC.r-R-1)continue;if(x<10+R+1||x>290-R-1)continue;
      let bad=false;for(const s of SEGS){if(s.oneway||(s.kind==='target'&&!s.up))continue;const ex=s.bx-s.ax,ey=s.by-s.ay,l2=ex*ex+ey*ey;let t=((x-s.ax)*ex+(y-s.ay)*ey)/l2;t=t<0?0:t>1?1:t;if(Math.hypot(x-(s.ax+ex*t),y-(s.ay+ey*t))<R+s.r+.5){bad=true;break;}}
      if(bad)continue;for(const c of CIRC)if(Math.hypot(x-c.x,y-c.y)<R+c.r+.5)bad=true;if(bad||inCavity(x,y,0))continue;
      for(const f of FLIPS){f.held=up;f.a=up?f.up:f.rest;f.w=0;}FU.pressT=simT;
      for(const f of FLIPS){const [tx,ty]=flipTip(f),ex=tx-f.px,ey=ty-f.py;let t=((x-f.px)*ex+(y-f.py)*ey)/(f.L*f.L);t=t<0?0:t>1?1:t;if(Math.hypot(x-(f.px+ex*t),y-(f.py+ey*t))<R+f.r1+.5)bad=true;}
      if(bad)continue;n++;ball.x=x;ball.y=y;ball.vx=ball.vy=0;ball.on=true;ball.ride=null;let dr=false;
      let q=null;for(let i=0;i<secs*480;i++){substep();if(i===(secs-0.5)*480)q=[ball.x,ball.y];if(ball.y>600){dr=true;break;}}
      if(dr||atPl(ball))continue;const sp=Math.hypot(ball.vx,ball.vy);if(sp>=20||(q&&Math.hypot(ball.x-q[0],ball.y-q[1])>2))continue;if(up&&onFace()==='cradle'&&Math.hypot(ball.x-FU.px,ball.y-FU.py)>FU.L+14)continue; // alleen hoofdflippers mogen de bal vasthouden
      out.push({up:up,x:+x.toFixed(1),y:+y.toFixed(1),ex:+ball.x.toFixed(1),ey:+ball.y.toFixed(1)});}
    noNudge=false;for(const f of FLIPS){f.held=false;f.a=f.rest;}targets.forEach(t=>t.up=true);[mode,launched]=sv;placeOnPlunger();return {tested:n,pockets:out};},
  fuHold:(secs)=>{noNudge=true;const out=[];let n=0;const sv=balls;balls=[mkBall(0,0)];ball=balls[0];
    for(let y=270;y<=345;y+=3)for(let x=222;x<=266;x+=3){let bad=false;for(const s of SEGS){const ex=s.bx-s.ax,ey=s.by-s.ay,l2=ex*ex+ey*ey;let t=((x-s.ax)*ex+(y-s.ay)*ey)/l2;t=t<0?0:t>1?1:t;if(Math.hypot(x-(s.ax+ex*t),y-(s.ay+ey*t))<R+s.r+.5)bad=true;}
      for(const c of CIRC)if(Math.hypot(x-c.x,y-c.y)<R+c.r+.5)bad=true;for(const f of FLIPS){f.held=false;f.a=f.rest;f.w=0;}
      {const f=FU,[tx,ty]=flipTip(f),ex=tx-f.px,ey=ty-f.py;let t=((x-f.px)*ex+(y-f.py)*ey)/(f.L*f.L);t=t<0?0:t>1?1:t;if(Math.hypot(x-(f.px+ex*t),y-(f.py+ey*t))<R+f.r1+.5)bad=true;}
      if(bad)continue;n++;ball.x=x;ball.y=y;ball.vx=ball.vy=0;ball.on=true;ball.ride=null;
      for(let i=0;i<secs*480;i++){if(i===24){FR.held=true;FU.held=true;FU.pressT=simT;}substep();if(ball.y>600)break;}
      if(ball.y<600&&Math.hypot(ball.vx,ball.vy)<20&&Math.hypot(ball.x-FU.px,ball.y-FU.py)<FU.L+14)out.push([x,y,+ball.x.toFixed(1),+ball.y.toFixed(1)]);}
    for(const f of FLIPS){f.held=false;f.a=f.rest;f.w=0;}noNudge=false;balls=sv;ball=balls[0];return {tested:n,resting:out};},
  addPts:n=>add(n),closeName:v=>closeNameBox(v),setT0:v=>{gameT0=simT-v;},killBalls:()=>{for(const b of balls)b.on=false;balls=[];feedQ=0;},auto:v=>{auto=v;},kick:v=>{kickback=v;},
  fuzz:(n,secs,seed,zone)=>{let rs=seed||1;const rnd=()=>{rs=(rs*16807)%2147483647;return rs/2147483647;};noNudge=true;const res={drained:0,onFace:0,cradled:0,trapped:[],cavityHits:0,live:0,still:[]};
    const sv=[mode,score,launched,saveUntil];balls=[ball];
    for(let k=0;k<n;k++){let x,y;
      if(zone==='U'){x=FU.px-60+rnd()*66;y=FU.py-70+rnd()*100;}else{const side=rnd()<.5?FL:FR;x=side.px+side.side*(-50+rnd()*110);y=440+rnd()*110;}
      ball.x=x;ball.y=y;ball.vx=(rnd()-.5)*1200;ball.vy=(rnd()-.5)*1200;ball.on=true;ball.ride=null;
      FL.held=rnd()<.5;FR.held=rnd()<.5;FU.held=FR.held;for(const f of FLIPS){f.a=f.held?f.up:f.rest;f.w=0;}
      let bad=x<10+R+1||x>290-R-1||(y<140&&Math.hypot(x-AC.x,y-AC.y)>AC.r-R-1);
      for(const s of SEGS){const ex=s.bx-s.ax,ey=s.by-s.ay,l2=ex*ex+ey*ey;let t=((x-s.ax)*ex+(y-s.ay)*ey)/l2;t=t<0?0:t>1?1:t;if(Math.hypot(x-(s.ax+ex*t),y-(s.ay+ey*t))<R+s.r+1)bad=true;}
      for(const c of CIRC)if(Math.hypot(x-c.x,y-c.y)<R+c.r+1)bad=true;
      for(const f of FLIPS){const [tx,ty]=flipTip(f);const ex=tx-f.px,ey=ty-f.py;let t=((x-f.px)*ex+(y-f.py)*ey)/(f.L*f.L);t=t<0?0:t>1?1:t;if(Math.hypot(x-(f.px+ex*t),y-(f.py+ey*t))<R+12)bad=true;}
      if(bad||inCavity(x,y,R+2)||y>560||x>266){k--;continue;}
      let drained=false,cav=false,toggle=0.2+rnd()*0.8,g0=glitches;
      for(let i=0;i<secs*480;i++){if(i%Math.round(toggle*480)===0&&rnd()<.5){FL.held=!FL.held;FR.held=!FR.held;FU.held=FR.held;}
        substep();if(inCavity(ball.x,ball.y))cav=true;if(ball.y>600){drained=true;break;}}
      if(cav)res.cavityHits++;
      if(drained)res.drained++;else{const on=onFace();if(on==='cradle')res.cradled++;else if(on)res.onFace++;else{res.live++;}
        if(cav||belowLine())res.trapped.push([+ball.x.toFixed(1),+ball.y.toFixed(1),+x.toFixed(1),+y.toFixed(1)]);
        if(Math.hypot(ball.vx,ball.vy)<5&&!on&&!atPl(ball))res.still.push([+ball.x.toFixed(1),+ball.y.toFixed(1)]);}}
    noNudge=false;for(const f of FLIPS)f.held=false;[mode,score,launched,saveUntil]=sv;placeOnPlunger();return res;},speed:n=>{simSpeed=n;},ballNo:n=>{ballNo=n;},
  audio:()=>({state:actx?actx.state:'none',gain:master?master.gain.value:null,nodes:nodeCount}),sfx:k=>{const n0=nodeCount;sfx[k]();return nodeCount-n0;},toggleMute:()=>toggleMute(),sfxAll:()=>{const n0=nodeCount;for(const k in sfx)sfx[k]();return nodeCount-n0;}};

resize();requestAnimationFrame(loop);
})();
