<script>
'use strict';
(function(){

/* ---------- schaal: hoogte passend, letterbox ---------- */
const TW=300,TH=640,OY=72;

/* ---------- lettertype 5x7 (eigen) ---------- */
const FONT={};
(function(){
 const d={A:'0E11111F111111',B:'1E11111E11111E',C:'0E11101010110E',D:'1E11111111111E',E:'1F10101E10101F',F:'1F10101E101010',G:'0E11101711110F',H:'1111111F111111',I:'0E04040404040E',J:'0702020202120C',K:'11121418141211',L:'1010101010101F',M:'111B1515111111',N:'11111915131111',O:'0E11111111110E',P:'1E11111E101010',Q:'0E11111115120D',R:'1E11111E141211',S:'0F10100E01011E',T:'1F040404040404',U:'1111111111110E',V:'11111111110A04',W:'1111111515150A',X:'11110A040A1111',Y:'1111110A040404',Z:'1F01020408101F',

})();


/* ---------- geluid ---------- */
let actx=null,master=null,unlocked=false,silentEl=null,audioOkOnce=false,nodeCount=0;
const isIOS=/iP(hone|ad|od)/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
function silentWavURI(){ // 0,5 s stille 8-bit mono WAV, in JS gemaakt (geen extern bestand)
  const sr=8000,n=4000,b=new Uint8Array(44+n),v=new DataView(b.buffer);const w=(o,s)=>{for(let i=0;i<s.length;i++)b[o+i]=s.charCodeAt(i);};

  v.setUint32(24,sr,true);v.setUint32(28,sr,true);v.setUint16(32,1,true);v.setUint16(34,8,true);w(36,'data');v.setUint32(40,n,true);b.fill(128,44);
  let s='';for(let i=0;i<b.length;i++)s+=String.fromCharCode(b[i]);return 'data:audio/wav;base64,'+btoa(s);}
function audio(){ // altijd synchroon vanuit een gebruikersgebaar aanroepen
  try{
    const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;
    if(navigator.audioSession){try{if(navigator.audioSession.type!=='playback')navigator.audioSession.type='playback';}catch(e){}}
    if(!actx){actx=new AC();master=actx.createGain();master.gain.value=muted?0:0.9;master.connect(actx.destination);
      actx.onstatechange=()=>{if(actx.state==='running')audioOkOnce=true;};}
    if(actx.state!=='running'){const p=actx.resume();if(p&&p.catch)p.catch(()=>{});}
    if(!unlocked){unlocked=true;
      const b=actx.createBuffer(1,1,22050),s=actx.createBufferSource();s.buffer=b;s.connect(actx.destination);s.start(0);
      if(isIOS&&!navigator.audioSession){try{silentEl=document.createElement('audio');silentEl.src=silentWavURI();silentEl.loop=true;silentEl.setAttribute('playsinline','');silentEl.setAttribute('x-webkit-airplay','deny');silentEl.preload='auto';}catch(e){silentEl=null;}}
    }

  }catch(e){}
}
['pointerdown','touchstart','touchend','mousedown','click','keydown'].forEach(t=>document.addEventListener(t,audio,{capture:true,passive:true}));
document.addEventListener('visibilitychange',()=>{if(!actx)return;
  if(document.hidden){if(silentEl)silentEl.pause();if(actx.state==='running'){const p=actx.suspend();if(p&&p.catch)p.catch(()=>{});}}
  else{const p=actx.resume();if(p&&p.catch)p.catch(()=>{});if(silentEl&&silentEl.paused){const q=silentEl.play();if(q&&q.catch)q.catch(()=>{});}}});
function canPlay(){return !muted&&actx&&master;}
function env(g,t,d,vol){vol=Math.min(.35,(vol||.05)*1.8);g.gain.setValueAtTime(0.0001,t);g.gain.linearRampToValueAtTime(vol,t+.006);g.gain.setValueAtTime(vol,t+Math.max(.01,d*.35));g.gain.exponentialRampToValueAtTime(.0001,t+d);}

function noise(d,vol,delay){if(!canPlay())return;try{const t=actx.currentTime+.01+(delay||0);const n=Math.floor(actx.sampleRate*d),buf=actx.createBuffer(1,n,actx.sampleRate),a=buf.getChannelData(0);for(let i=0;i<n;i++)a[i]=(Math.random()*2-1)*(1-i/n);const s=actx.createBufferSource();s.buffer=buf;const g=actx.createGain();nodeCount+=2;g.gain.value=Math.min(.4,vol*1.6);s.connect(g);g.connect(master);s.start(t);}catch(e){}}

 launch(){noise(.25,.14);tone(180,.25,'sawtooth',.04,420);},
 drain(){[523,415,330,262].forEach((f,i)=>tone(f,.18,'square',.05,-20,i*.15));},
 save(){[784,1047,1319].forEach((f,i)=>tone(f,.1,'square',.05,0,i*.08));},
 extra(){[523,659,784,1047,1319,1568].forEach((f,i)=>tone(f,.09,'square',.05,0,i*.07));},
 bonk(){[196,0,196,262,330,392].forEach((f,i)=>{if(f)tone(f,.12,'square',.07,0,i*.09);});noise(.3,.12);},
 mult(){[880,1109,1319,1760].forEach((f,i)=>tone(f,.07,'square',.05,0,i*.05));},
 tick(){tone(1760,.04,'square',.03);},
 tilt(){tone(110,.6,'sawtooth',.08,-30);},
 warn(){tone(330,.15,'square',.06);tone(330,.15,'square',.06,0,.2);},
 kick(){tone(300,.15,'square',.07,500);noise(.08,.12);},
 start(){[392,523,659,784,1047].forEach((f,i)=>tone(f,.09,'square',.05,0,i*.08));},
 over(){[659,523,440,349,262].forEach((f,i)=>tone(f,.2,'square',.05,-10,i*.18));}
};
const bMute=document.getElementById('bMute');
function updMute(){bMute.textContent=muted?'GELUID UIT':'GELUID AAN';}
function toggleMute(){muted=!muted;lsSet('flip-mute',muted?'1':'0');updMute();audio();if(master)master.gain.value=muted?0:0.9;if(!muted)sfx.tick();}
updMute();

/* ---------- tafel ---------- */
const R=7,G=1050,MAXV=2300,DT=1/480;
const M={wall:{e:.45,f:.0015},rubber:{e:.75,f:.004},post:{e:.6,f:.003},flip:{e:.32,f:.003},target:{e:.35,f:.002},bump:{e:.6,f:.002}};
const SEGS=[],CIRC=[];
function seg(ax,ay,bx,by,o){const s=Object.assign({ax:ax,ay:ay,bx:bx,by:by,r:0,mat:M.wall,kind:'wall'},o||{});SEGS.push(s);return s;}
function pl(p,o){for(let i=0;i+3<p.length;i+=2)seg(p[i],p[i+1],p[i+2],p[i+3],o);}
const mx=x=>278-x;
// boog bovenaan
const AC={x:150,y:140,r:140};
{const n=36;for(let i=0;i<n;i++){const a0=Math.PI+Math.PI*i/n,a1=Math.PI+Math.PI*(i+1)/n;seg(AC.x+AC.r*Math.cos(a0),AC.y+AC.r*Math.sin(a0),AC.x+AC.r*Math.cos(a1),AC.y+AC.r*Math.sin(a1),{kind:'arc'});}}
seg(10,140,10,610);seg(290,140,290,560);seg(268,150,268,610,{r:1});
const gate=seg(268,140,290,118,{oneway:true,r:1,kind:'gate'});{const ex=gate.bx-gate.ax,ey=gate.by-gate.ay,l=Math.hypot(ex,ey);gate.nx=ey/l;gate.ny=-ex/l;}
seg(40,150,40,240,{r:2,kind:'guide'});seg(220,150,220,300,{r:2,kind:'guide'});
[92,124,156,188].forEach(x=>seg(x,38,x,62,{r:2,mat:M.post,kind:'post'}));
// inlaan: geleider loopt RAAKLIJNIG over de scharnierkap (bovenvlak geleider raakt de kap, geen dal/naad);
// schuine kop bovenaan (geen vlak rustpunt); slingshot verder van de geleider zodat de inlaan overal >= 2 px breder is dan de bal
const GS={x:30,y:440},GUIDE={};

  const sx=side<0?GS.x:mx(GS.x),dx=px-sx,dy=py-GS.y,D=Math.hypot(dx,dy),rr=9-2,al=Math.asin(rr/D)*(side<0?-1:1),L=Math.sqrt(D*D-rr*rr);

{const eL=guideEnd(81,490,-1),eR=guideEnd(197,490,1);GUIDE.L=[GS.x,GS.y,eL[0],eL[1]];GUIDE.R=[mx(GS.x),GS.y,eR[0],eR[1]];
 pl([32,365,30,372,GS.x,GS.y,eL[0],eL[1]],{r:2,kind:'guide'});pl([mx(32),365,mx(30),372,mx(GS.x),GS.y,eR[0],eR[1]],{r:2,kind:'guide'});}
seg(30,440,30,610,{r:2,kind:'guide'});seg(mx(30),440,mx(30),610,{r:2,kind:'guide'});
// slingshots
seg(52,384,52,424,{r:2,kind:'sling-side'});seg(52,424,74,446,{r:2,kind:'sling-side'});const slL=seg(74,446,52,384,{r:2,mat:M.rubber,kind:'sling',cd:0});
seg(mx(52),384,mx(52),424,{r:2,kind:'sling-side'});seg(mx(52),424,mx(74),446,{r:2,kind:'sling-side'});const slR=seg(mx(74),446,mx(52),384,{r:2,mat:M.rubber,kind:'sling',cd:0});
// valdoelen (BONK)
const targets=[106,130,154].map((x,i)=>seg(x,268,x+18,268,{r:2,mat:M.target,kind:'target',up:true,i:i}));
// pop bumpers
const bumpers=[[95,150],[183,150],[139,200]].map(p=>{const c={x:p[0],y:p[1],r:15,mat:M.bump,kind:'bumper',flash:0,cd:0};CIRC.push(c);return c;});
// flippers
function mkFlip(px,py,rest,up,side){return {px:px,py:py,a:rest,rest:rest,up:up,w:0,L:50,r1:9,r2:5,side:side,held:false};}
const FL=mkFlip(81,490,0.5,-0.45,-1),FR=mkFlip(197,490,Math.PI-0.5,Math.PI+0.45,1);
// dichte holte achter/onder elke flipper: scharnierkap + onzichtbare vloer op de rustlijn + afsluitwand onder de tip
for(const f of [FL,FR]){CIRC.push({x:f.px,y:f.py,r:f.r1,mat:M.post,kind:'pivot'});
  const tx=f.px+Math.cos(f.rest)*f.L,ty=f.py+Math.sin(f.rest)*f.L;
  seg(f.px,f.py,tx,ty,{r:f.r2,kind:'floor',hidden:true});seg(tx,ty,tx,610,{r:f.r2,kind:'floor',hidden:true});}
const PLX0=268,PLX1=290,PLY=540;
let plCharge=0,plHeld=false;
// sensoren
const lanes=[108,140,172].map(x=>({x:x,lit:false,inside:false}));

/* ---------- spelstatus ---------- */
let mode='title',paused=false,score=0,ballNo=1,extraBalls=0,extraGiven=false,mult=1,bonus=0,tilt=0,tilted=false,kickback=true,saveUntil=0,simT=0,
    msg='',msgT=0,bonusShown=0,bonusLeft=0,stuckT=0,glitches=0,stuckNudges=0,spinV=0,spinAcc=0,newRecord=false,lastLaunch=-99,launched=false,simSpeed=1,auto=false;
const ball={x:279,y:PLY-R,vx:0,vy:0,on:false};
let parts=[];
function message(t,d){msg=t;msgT=d||1.6;dmdKey='';}
function add(n,b){if(tilted)return;score+=n*mult;bonus+=b||0;if(!extraGiven&&score>=50000){extraGiven=true;extraBalls++;sfx.extra();message('EXTRA BAL!',2);}
  if(score>hiScore){hiScore=score;newRecord=true;lsSet('flip-hi',String(hiScore));}}
function burst(x,y,col,n){for(let i=0;i<(n||10);i++){const a=Math.random()*6.283,v=60+Math.random()*180;parts.push({x:x,y:y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,t:.4+Math.random()*.3,c:col});}}
function placeOnPlunger(){ball.x=279;ball.y=PLY-R;ball.vx=ball.vy=0;ball.on=true;launched=false;}
function newBall(){mult=1;bonus=0;tilt=0;tilted=false;targets.forEach(t=>t.up=true);lanes.forEach(l=>l.lit=false);placeOnPlunger();mode='play';dmdKey='';}
function startGame(){score=0;ballNo=1;extraBalls=0;extraGiven=false;newRecord=false;kickback=true;newBall();sfx.start();message('BAL 1',1.5);}

/* ---------- natuurkunde ---------- */
function resolve(nx,ny,cvx,cvy,mat){
  const rvx=ball.vx-cvx,rvy=ball.vy-cvy,vn=rvx*nx+rvy*ny;if(vn>=0)return 0;
  const tx=-ny,ty=nx,vt=rvx*tx+rvy*ty,e=-vn<35?0:mat.e;
  ball.vx=cvx+nx*(-vn*e)+tx*vt*(1-mat.f);ball.vy=cvy+ny*(-vn*e)+ty*vt*(1-mat.f);return -vn;
}
function hitSeg(s){
  const ex=s.bx-s.ax,ey=s.by-s.ay,l2=ex*ex+ey*ey;let t=((ball.x-s.ax)*ex+(ball.y-s.ay)*ey)/l2;t=t<0?0:t>1?1:t;
  const px=s.ax+ex*t,py=s.ay+ey*t;let dx=ball.x-px,dy=ball.y-py;const rr=R+s.r,d2=dx*dx+dy*dy;if(d2>=rr*rr)return -1;
  if(s.oneway&&((ball.x-s.ax)*s.nx+(ball.y-s.ay)*s.ny)<0)return -1;
  let d=Math.sqrt(d2),nx,ny;if(d<1e-6){const l=Math.sqrt(l2);nx=-ey/l;ny=ex/l;d=0;}else{nx=dx/d;ny=dy/d;}
  ball.x=px+nx*rr;ball.y=py+ny*rr;const imp=resolve(nx,ny,0,0,s.mat);s._nx=nx;s._ny=ny;return imp;
}
function hitCirc(c){const dx=ball.x-c.x,dy=ball.y-c.y,rr=R+c.r,d2=dx*dx+dy*dy;if(d2>=rr*rr)return -1;const d=Math.sqrt(d2)||1e-6,nx=dx/d,ny=dy/d;
  ball.x=c.x+nx*rr;ball.y=c.y+ny*rr;resolve(nx,ny,0,0,c.mat);c._nx=nx;c._ny=ny;return 1;}
function flipTip(f){return [f.px+Math.cos(f.a)*f.L,f.py+Math.sin(f.a)*f.L];}
function hitFlip(f){
  const [tx,ty]=flipTip(f),ex=tx-f.px,ey=ty-f.py;let t=((ball.x-f.px)*ex+(ball.y-f.py)*ey)/(f.L*f.L);t=t<0?0:t>1?1:t;
  const qx=f.px+ex*t,qy=f.py+ey*t,rad=f.r1+(f.r2-f.r1)*t;let dx=ball.x-qx,dy=ball.y-qy;const rr=R+rad,d2=dx*dx+dy*dy;if(d2>=rr*rr)return;
  const d=Math.sqrt(d2)||1e-6;let nx=dx/d,ny=dy/d;
  const sa=Math.sin(f.a),ca=Math.cos(f.a),fx=f.side<0?sa:-sa,fy=f.side<0?-ca:ca; // normaal van het speelvlak (naar boven)
  if(nx*fx+ny*fy<0&&t>0){nx=fx;ny=fy;} // achter/onder de flipper: nooit de holte in, altijd naar de speelveldkant
  ball.x=qx+nx*rr;ball.y=qy+ny*rr;
  const cx=qx+nx*rad,cy=qy+ny*rad;resolve(nx,ny,-f.w*(cy-f.py),f.w*(cx-f.px),M.flip);
}
function flipUpdate(f,h){const up=f.held&&!tilted,target=up?f.up:f.rest,sp=up?30:20,dir=Math.sign(target-f.a);
  if(Math.abs(target-f.a)<1e-4){f.w=0;return;}f.w=dir*sp;f.a+=f.w*h;if((dir>0&&f.a>target)||(dir<0&&f.a<target)){f.a=target;}}
function collideAll(){
  for(const s of SEGS){if(s.kind==='target'&&!s.up)continue;const imp=hitSeg(s);if(imp<0)continue;
    if(s.kind==='sling'&&imp>60&&simT>s.cd){s.cd=simT+.12;ball.vx+=s._nx*650;ball.vy+=s._ny*650;add(10,20);sfx.sling();burst(ball.x,ball.y,'#7affff',8);s.flash=.15;}
    else if(s.kind==='target'&&imp>20){s.up=false;add(500,500);sfx.target();burst(ball.x,ball.y,'#ffd23f',14);
      if(targets.every(t=>!t.up)){add(5000,1000);kickback=true;sfx.bonk();message('BONK!',2.2);setTimeout(()=>targets.forEach(t=>t.up=true),2000);}}
  }
  for(const c of CIRC){if(hitCirc(c)<0||c.kind!=='bumper')continue;const vn=ball.vx*c._nx+ball.vy*c._ny;if(vn<850){ball.vx+=c._nx*(850-vn);ball.vy+=c._ny*(850-vn);}
    if(simT>c.cd){c.cd=simT+.06;c.flash=.18;add(100,50);sfx.bump();burst(c.x+c._nx*c.r,c.y+c._ny*c.r,'#ff3fa4',10);}}
  hitFlip(FL);hitFlip(FR);

  const py=PLY+plCharge*16;if(ball.x>PLX0&&ball.x<PLX1&&ball.y+R>py){ball.y=py-R;if(ball.vy>0)ball.vy=ball.vy>60?-ball.vy*.2:0;}
}
function substep(){
  const sp=Math.hypot(ball.vx,ball.vy),fw=Math.max(Math.abs(FL.w),Math.abs(FR.w))*FL.L;
  const n=Math.max(1,Math.ceil((sp+fw)*DT/(R*0.35)));const h=DT/n;
  for(let i=0;i<n;i++){flipUpdate(FL,h);flipUpdate(FR,h);
    if(ball.on){ball.vy+=G*h;ball.x+=ball.vx*h;ball.y+=ball.vy*h;collideAll();}}
  const v=Math.hypot(ball.vx,ball.vy);if(v>MAXV){ball.vx*=MAXV/v;ball.vy*=MAXV/v;}
  simT+=DT;
  if(DEBUG)checkBounds();
}
function checkBounds(){ // zelftest: diep in een muur of buiten de kast = fout
  if(!ball.on)return;let bad=false;

// holte achter/onder de flipper: onder de rustlijn van de flipper (tussen inlane-geleider en tip), of achter het scharnier

      if(lanes.every(q=>q.lit)){lanes.forEach(q=>q.lit=false);if(mult<5)mult++;add(1000,500);sfx.mult();message(mult+'X MULTIPLIER',1.8);}}l.inside=ins;});

function dmdContent(){
  const t=performance.now()/1000;
  if(mode==='title'){return Math.floor(t/3)%2===0?[['FLIPPER!',64,3,2,'c'],['BOUWPLAATS',64,19,1,'c']]:[['HOOG',64,3,1,'c'],[fmt(hiScore),64,13,2,'c']];}
  if(mode==='over')return Math.floor(t/2.5)%2===0?[['SPEL VOORBIJ',64,3,1,'c'],[fmt(score),64,13,2,'c']]:[['HOOG',64,3,1,'c'],[fmt(hiScore),64,13,2,'c']];
  if(msg)return msg.length<=10?[[msg,64,7,2,'c']]:[[msg,64,10,1,'c']];
  if(mode==='bonus')return [['BONUS '+fmt(bonusShown),64,3,1,'c'],[fmt(score),64,13,2,'c']];
  const sc=fmt(score);return [['BAL '+ballNo,1,1,1],[mult+'X',127,1,1,'r'],[sc,64,11,sc.length>10?1:2,'c']];
}
function drawDMD(){
  const content=dmdContent(),key=JSON.stringify(content)+cv.width;
  if(key!==dmdKey){dmdKey=key;dmd.fill(0);for(const c of content)dText(c[0],c[1],c[2],c[3],c[4]);
    const pitch=2.3,w=Math.round(DW*pitch*S*DPR),h=Math.round(DH*pitch*S*DPR);dmdCan.width=w;dmdCan.height=h;const d=dmdCan.getContext('2d');d.fillStyle='#0a0502';d.fillRect(0,0,w,h);
    const p=pitch*S*DPR;for(let y=0;y<DH;y++)for(let x=0;x<DW;x++){const on=dmd[y*DW+x];d.fillStyle=on?'#ffa62e':'#2a1608';d.beginPath();d.arc((x+.5)*p,(y+.5)*p,p*0.38,0,7);d.fill();}}
  const x=(OX+(TW-DW*2.3)/2*S)*DPR,y=(OYs+4*S)*DPR;ctx.shadowColor='#ff8a00';ctx.shadowBlur=10*DPR;ctx.drawImage(dmdCan,x,y);ctx.shadowBlur=0;
  ctx.strokeStyle='#5a3a1a';ctx.lineWidth=2*DPR;ctx.strokeRect(x-2*DPR,y-2*DPR,dmdCan.width+4*DPR,dmdCan.height+4*DPR);
}
let readyCls=null;const bL=document.getElementById('bLaunch');
function updLaunchBtn(){const r=mode==='play'&&ball.on&&!launched&&ball.x>268||bL.classList.contains('on')&&mode==='play'&&ball.x>268&&ball.y>150;if(r!==readyCls){readyCls=r;document.body.classList.toggle('ready',r);}}
function loop(now){const dt=Math.min(0.05,(now-last)/1000);last=now;fpsLog.push(dt);if(fpsLog.length>240)fpsLog.shift();
  for(let i=0;i<simSpeed;i++)frameUpdate(dt);updLaunchBtn();render();requestAnimationFrame(loop);}
if(DEBUG)window.__fl={state:()=>({btn:getComputedStyle(bL).display,flipR:FR.held,flipL:FL.held,mode:mode,paused:paused,score:score,ball:ballNo,extra:extraBalls,on:ball.on,x:ball.x,y:ball.y,vx:ball.vx,vy:ball.vy,atPl:atPlunger(),launched:launched,
    save:mode==='play'&&launched&&simT<saveUntil,mult:mult,bonus:bonus,tilt:tilt,tilted:tilted,kickback:kickback,glitches:glitches,stuck:stuckNudges,targets:targets.map(t=>t.up),lanes:lanes.map(l=>l.lit),hi:hiScore,msg:msg,
    fps:fpsLog.length?fpsLog.length/fpsLog.reduce((a,b)=>a+b,0):0,muted:muted}),
  place:(x,y,vx,vy)=>{ball.x=x;ball.y=y;ball.vx=vx||0;ball.vy=vy||0;ball.on=true;},setLaunched:(v,save)=>{launched=v;lastLaunch=simT;saveUntil=simT+(save||0);},
  pockets:(step,secs,ylo)=>{noNudge=true;const out=[];let n=0;const sv=[mode,launched];
    for(const up of [false,true])for(let y=(ylo||0)+1.37;y<560;y+=step)for(let x=11.71;x<289;x+=step){
      if(y<140&&Math.hypot(x-AC.x,y-AC.y)>AC.r-R-1)continue;if(x<10+R+1||x>290-R-1)continue;
      let bad=false;for(const s of SEGS){if(s.oneway||(s.kind==='target'&&!s.up))continue;const ex=s.bx-s.ax,ey=s.by-s.ay,l2=ex*ex+ey*ey;let t=((x-s.ax)*ex+(y-s.ay)*ey)/l2;t=t<0?0:t>1?1:t;if(Math.hypot(x-(s.ax+ex*t),y-(s.ay+ey*t))<R+s.r+.5){bad=true;break;}}
      if(bad)continue;for(const c of CIRC)if(Math.hypot(x-c.x,y-c.y)<R+c.r+.5)bad=true;if(bad||inCavity(x,y,0))continue;
      FL.held=FR.held=up;FL.a=up?FL.up:FL.rest;FR.a=up?FR.up:FR.rest;FL.w=FR.w=0;
      for(const f of [FL,FR]){const [tx,ty]=flipTip(f),ex=tx-f.px,ey=ty-f.py;let t=((x-f.px)*ex+(y-f.py)*ey)/(f.L*f.L);t=t<0?0:t>1?1:t;if(Math.hypot(x-(f.px+ex*t),y-(f.py+ey*t))<R+f.r1+.5)bad=true;}
      if(bad)continue;n++;ball.x=x;ball.y=y;ball.vx=ball.vy=0;ball.on=true;let dr=false;
      let q=null;for(let i=0;i<secs*480;i++){substep();if(i===(secs-0.5)*480)q=[ball.x,ball.y];if(ball.y>600){dr=true;break;}}
      if(dr||atPlunger())continue;const sp=Math.hypot(ball.vx,ball.vy);if(sp>=20||(q&&Math.hypot(ball.x-q[0],ball.y-q[1])>2))continue;if(up&&onFace()==='cradle')continue;
      out.push({up:up,x:+x.toFixed(1),y:+y.toFixed(1),ex:+ball.x.toFixed(1),ey:+ball.y.toFixed(1)});}
    noNudge=false;FL.held=FR.held=false;FL.a=FL.rest;FR.a=FR.rest;targets.forEach(t=>t.up=true);[mode,launched]=sv;placeOnPlunger();return {tested:n,pockets:out};},
  auto:v=>{auto=v;},kick:v=>{kickback=v;},
  fuzz:(n,secs,seed)=>{let rs=seed||1;const rnd=()=>{rs=(rs*16807)%2147483647;return rs/2147483647;};noNudge=true;const res={drained:0,onFace:0,cradled:0,trapped:[],cavityHits:0,live:0};
    const sv=[mode,score,launched,saveUntil];
    for(let k=0;k<n;k++){const side=rnd()<.5?FL:FR,sx=side.side;
      const x=side.px+sx*(-50+rnd()*110),y=440+rnd()*110;ball.x=x;ball.y=y;ball.vx=(rnd()-.5)*1200;ball.vy=(rnd()-.5)*1200;ball.on=true;
      FL.held=rnd()<.5;FR.held=rnd()<.5;FL.a=FL.held?FL.up:FL.rest;FR.a=FR.held?FR.up:FR.rest;FL.w=FR.w=0;
      // start niet in een collider
      let bad=false;for(const s of SEGS){const ex=s.bx-s.ax,ey=s.by-s.ay,l2=ex*ex+ey*ey;let t=((x-s.ax)*ex+(y-s.ay)*ey)/l2;t=t<0?0:t>1?1:t;if(Math.hypot(x-(s.ax+ex*t),y-(s.ay+ey*t))<R+s.r+1)bad=true;}
      for(const f of [FL,FR]){const [tx,ty]=flipTip(f);const ex=tx-f.px,ey=ty-f.py;let t=((x-f.px)*ex+(y-f.py)*ey)/(f.L*f.L);t=t<0?0:t>1?1:t;if(Math.hypot(x-(f.px+ex*t),y-(f.py+ey*t))<R+12)bad=true;}
      if(bad||inCavity(x,y,R+2)||y>560){k--;continue;}
      let drained=false,cav=false,toggle=0.2+rnd()*0.8;
      for(let i=0;i<secs*480;i++){if(i%Math.round(toggle*480)===0&&rnd()<.5){FL.held=!FL.held;FR.held=!FR.held;}
        substep();if(inCavity(ball.x,ball.y))cav=true;if(ball.y>600){drained=true;break;}}
      if(cav)res.cavityHits++;
      if(drained)res.drained++;else{const on=onFace();if(on==='cradle')res.cradled++;else if(on)res.onFace++;else{res.live++;}
        if(cav||belowLine())res.trapped.push([+ball.x.toFixed(1),+ball.y.toFixed(1),+x.toFixed(1),+y.toFixed(1)]);}}
    noNudge=false;FL.held=FR.held=false;ball.on=false;[mode,score,launched,saveUntil]=sv;placeOnPlunger();return res;},speed:n=>{simSpeed=n;},ballNo:n=>{ballNo=n;},
  audio:()=>({state:actx?actx.state:'none',gain:master?master.gain.value:null,nodes:nodeCount}),sfxAll:()=>{const n0=nodeCount;for(const k in sfx)sfx[k]();return nodeCount-n0;}};
resize();requestAnimationFrame(loop);
})();
